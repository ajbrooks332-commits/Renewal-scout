openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Renewal Scout API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: services
    description: Household service management
  - name: research
    description: Research runs and reports
  - name: dashboard
    description: Dashboard stats
  - name: household
    description: Household profile
  - name: deals
    description: Current deal records and document extraction

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current auth status
      responses:
        "200":
          description: Auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /household-profile:
    get:
      operationId: getHouseholdProfile
      tags: [household]
      summary: Get the household profile
      responses:
        "200":
          description: Household profile (may be mostly null if not yet filled in)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateHouseholdProfile
      tags: [household]
      summary: Create or update the household profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all active household services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createService
      tags: [services]
      summary: Create a new household service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a single service with its research runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Service with runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateService
      tags: [services]
      summary: Update an existing service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/archive:
    post:
      operationId: archiveService
      tags: [services]
      summary: Archive a service (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/requirements:
    get:
      operationId: getServiceRequirements
      tags: [services]
      summary: Get service-specific requirement fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Requirements (empty object if none saved yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequirements"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateServiceRequirements
      tags: [services]
      summary: Save service-specific requirement fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequirementsInput"
      responses:
        "200":
          description: Saved requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequirements"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/current-deal:
    get:
      operationId: getCurrentDeal
      tags: [deals]
      summary: Get the current deal for a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Current deal fields with provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDeal"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCurrentDeal
      tags: [deals]
      summary: Save or update the current deal for a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentDealInput"
      responses:
        "200":
          description: Updated current deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDeal"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/extract-document:
    post:
      operationId: extractDocument
      tags: [deals]
      summary: >
        Upload a document (PDF, JPG, PNG ≤ 10 MB) and extract deal fields via AI.
        The document is sent to the OpenAI API; document bytes are never persisted.
        Returns a draft with all fields marked extracted_unconfirmed — user must
        confirm before values are used in research.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
              required:
                - document
      responses:
        "200":
          description: Extraction draft — all fields are extracted_unconfirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionDraft"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large (> 10 MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported file type (only PDF, JPG, PNG accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/extraction-draft/{extractionId}/confirm:
    put:
      operationId: confirmExtractionDraft
      tags: [deals]
      summary: >
        Confirm, correct, or delete extracted field values.
        Confirmed fields are saved to current_deals with source extracted_confirmed.
        Deleted fields are removed from the draft.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: extractionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionConfirmInput"
      responses:
        "200":
          description: Updated current deal after confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDeal"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service or extraction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/extraction-draft/pending:
    get:
      operationId: getPendingExtractionDraft
      tags: [deals]
      summary: >
        Get the most recent pending (status=draft) extraction draft for a service,
        if one exists. Used to restore UI state after page refresh.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pending draft or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExtractionDraft"
                  - type: "null"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/extraction-draft/{extractionId}/discard:
    post:
      operationId: discardExtractionDraft
      tags: [deals]
      summary: Discard a pending extraction draft without applying it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: extractionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Draft discarded successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service or draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Draft already applied or discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/{id}/research:
    post:
      operationId: triggerResearch
      tags: [research]
      summary: Queue and start a research run for a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                researchMode:
                  type: string
                  enum: [personalised, generic]
                  description: >
                    Pass "generic" to proceed despite missing required fields.
                    Research uses generic prompts instead of personalised ones.
                forceWithMissing:
                  type: boolean
                  deprecated: true
                  description: >
                    Deprecated. Use researchMode: "generic" instead.
                    Accepted for backward compatibility.
      responses:
        "202":
          description: Research queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing required fields — pass researchMode:"generic" to override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletenessError"

  /research-runs:
    get:
      operationId: listResearchRuns
      tags: [research]
      summary: List recent research runs across all services
      responses:
        "200":
          description: Recent research runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchRunWithService"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /due-check:
    post:
      operationId: runDueCheck
      tags: [research]
      summary: Scan all active services and queue research for those that are due
      responses:
        "202":
          description: Due check started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueCheckResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    LoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required:
        - password

    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        setupWarnings:
          type: array
          items:
            type: string
      required:
        - authenticated
        - setupWarnings

    DashboardStats:
      type: object
      properties:
        totalServices:
          type: number
        totalAnnualCostGbp:
          type: ["number", "null"]
        withinNinetyDays:
          type: number
        dueNow:
          type: number
      required:
        - totalServices
        - totalAnnualCostGbp
        - withinNinetyDays
        - dueNow

    # ─── Household profile ──────────────────────────────────────────────────────

    HouseholdProfile:
      type: object
      properties:
        id:
          type: number
        postcode:
          type: ["string", "null"]
        propertyType:
          type: ["string", "null"]
        tenure:
          type: ["string", "null"]
        bedrooms:
          type: ["number", "null"]
        yearBuilt:
          type: ["number", "null"]
        numAdults:
          type: ["number", "null"]
        numChildren:
          type: ["number", "null"]
        heatingType:
          type: ["string", "null"]
        hasEv:
          type: ["boolean", "null"]
        evChargerType:
          type: ["string", "null"]
        hasSolar:
          type: ["boolean", "null"]
        solarExportTariff:
          type: ["string", "null"]
        annualElectricityKwh:
          type: ["number", "null"]
        annualGasKwh:
          type: ["number", "null"]
        hasSkyTv:
          type: ["boolean", "null"]
        hasSkyMobile:
          type: ["boolean", "null"]
        hasVirginMedia:
          type: ["boolean", "null"]
        numCars:
          type: ["number", "null"]
        carMake:
          type: ["string", "null"]
        carModel:
          type: ["string", "null"]
        carYear:
          type: ["number", "null"]
        carValue:
          type: ["number", "null"]
        annualMileage:
          type: ["number", "null"]
        drivingExperience:
          type: ["string", "null"]
        claimsLast5Years:
          type: ["number", "null"]
        smoker:
          type: ["boolean", "null"]
        accessibilityNeeds:
          type: ["string", "null"]
        generalPreferences:
          type: ["string", "null"]
        vehicles:
          type: array
          description: Multi-vehicle array. All vehicle fields are optional to support in-progress questionnaire saves.
          items:
            $ref: "#/components/schemas/VehicleRecord"
        unknownFields:
          type: array
          description: Field names the user explicitly marked as "I don't know"
          items:
            type: string
        questionnaireVersion:
          type: string
        updatedAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - questionnaireVersion
        - updatedAt
        - createdAt

    HouseholdProfileInput:
      type: object
      properties:
        postcode:
          type: ["string", "null"]
          maxLength: 10
        propertyType:
          type: ["string", "null"]
        tenure:
          type: ["string", "null"]
        bedrooms:
          type: ["number", "null"]
        yearBuilt:
          type: ["number", "null"]
        numAdults:
          type: ["number", "null"]
        numChildren:
          type: ["number", "null"]
        heatingType:
          type: ["string", "null"]
        hasEv:
          type: ["boolean", "null"]
        evChargerType:
          type: ["string", "null"]
        hasSolar:
          type: ["boolean", "null"]
        solarExportTariff:
          type: ["string", "null"]
          maxLength: 100
        annualElectricityKwh:
          type: ["number", "null"]
        annualGasKwh:
          type: ["number", "null"]
        hasSkyTv:
          type: ["boolean", "null"]
        hasSkyMobile:
          type: ["boolean", "null"]
        hasVirginMedia:
          type: ["boolean", "null"]
        numCars:
          type: ["number", "null"]
        carMake:
          type: ["string", "null"]
          maxLength: 80
        carModel:
          type: ["string", "null"]
          maxLength: 80
        carYear:
          type: ["number", "null"]
        carValue:
          type: ["number", "null"]
        annualMileage:
          type: ["number", "null"]
        drivingExperience:
          type: ["string", "null"]
        claimsLast5Years:
          type: ["number", "null"]
        smoker:
          type: ["boolean", "null"]
        accessibilityNeeds:
          type: ["string", "null"]
          maxLength: 500
        generalPreferences:
          type: ["string", "null"]
          maxLength: 500
        vehicles:
          type: array
          description: Multi-vehicle array. All fields optional to support partial saves.
          items:
            $ref: "#/components/schemas/VehicleRecord"
        unknownFields:
          type: array
          description: Field names the user explicitly marked as "I don't know"
          items:
            type: string

    VehicleRecord:
      type: object
      description: A single vehicle entry. All fields optional — partial saves are valid.
      properties:
        make:
          type: ["string", "null"]
          maxLength: 100
        model:
          type: ["string", "null"]
          maxLength: 100
        year:
          type: ["number", "null"]
        valuePence:
          type: ["number", "null"]
        annualMileage:
          type: ["number", "null"]
        drivingExperience:
          type: ["string", "null"]
        claimsLast5Years:
          type: ["number", "null"]

    # ─── Service requirements ───────────────────────────────────────────────────

    ServiceRequirements:
      type: object
      properties:
        serviceId:
          type: number
        schemaVersion:
          type: string
        fields:
          type: object
          description: Service-type-specific requirement answers (values may be null = "I don't know")
          additionalProperties: true
        unknownFields:
          type: array
          description: Field names the user explicitly marked as "I don't know" (for UI state recovery)
          items:
            type: string
        updatedAt:
          type: string
      required:
        - serviceId
        - schemaVersion
        - fields
        - updatedAt

    ServiceRequirementsInput:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: true
        unknownFields:
          type: array
          description: Field names the user explicitly marked as "I don't know"
          items:
            type: string
      required:
        - fields

    # ─── Current deal ───────────────────────────────────────────────────────────

    ProvenanceSource:
      type: string
      enum:
        - user
        - extracted_confirmed
        - extracted_unconfirmed
        - unknown

    ProvenanceField:
      type: object
      properties:
        value: {}
        source:
          $ref: "#/components/schemas/ProvenanceSource"
      required:
        - source

    CurrentDeal:
      type: object
      properties:
        serviceId:
          type: number
        fields:
          type: object
          description: Deal fields — each value includes provenance
          additionalProperties:
            $ref: "#/components/schemas/ProvenanceField"
        lastConfirmedAt:
          type: ["string", "null"]
        updatedAt:
          type: string
      required:
        - serviceId
        - fields
        - updatedAt

    CurrentDealInput:
      type: object
      description: >
        Manual deal update. Clients supply raw field values; the server always
        assigns source: "user". Clients cannot set provenance directly.
      properties:
        values:
          type: object
          description: >
            Field name → raw value map. Each entry is saved with source: "user".
            Omit a field to leave its current value unchanged.
          additionalProperties: {}
        clear:
          type: array
          description: >
            Field keys whose user-entered values should be removed.
            Only user-sourced values are removed; extracted_confirmed values
            are not affected.
          items:
            type: string
      required: []

    # ─── Document extraction ────────────────────────────────────────────────────

    ExtractionDraft:
      type: object
      properties:
        extractionId:
          type: string
        serviceId:
          type: number
        status:
          type: string
          enum: [draft, applying, applied, discarded, expired, failed]
          description: >
            Lifecycle state of this extraction draft.
            Only 'draft' status drafts are actionable by the user.
        fields:
          type: object
          description: >
            Extracted deal fields — all have source=extracted_unconfirmed
            until the user confirms them.
          additionalProperties:
            $ref: "#/components/schemas/ProvenanceField"
        extractedAt:
          type: string
        expiresAt:
          type: ["string", "null"]
          description: ISO timestamp after which this draft expires
        aiDisclosure:
          type: string
          description: Human-readable notice that the document was sent to the OpenAI API
      required:
        - extractionId
        - serviceId
        - status
        - fields
        - extractedAt
        - aiDisclosure

    ExtractionConfirmInput:
      type: object
      description: >
        Confirmation of extracted field values. Do NOT include a "source" property
        in confirmedFields — the server always assigns source: "extracted_confirmed".
      properties:
        confirmedFields:
          type: object
          description: >
            Field name → { value } map. The server assigns source: "extracted_confirmed"
            to each entry. Omit a field here (or add it to deletedFields) to discard it.
          additionalProperties:
            type: object
            properties:
              value: {}
        deletedFields:
          type: array
          items:
            type: string
          description: Field keys from the extraction draft to discard without confirming
      required:
        - confirmedFields

    # ─── Completeness ───────────────────────────────────────────────────────────

    MissingField:
      type: object
      description: A field that is missing, with a label and destination for navigation
      properties:
        label:
          type: string
          description: Human-readable field label shown in the completeness gate UI
        destination:
          type: string
          enum: [household, requirements, current-deal]
          description: Which page/tab contains the input for this field
      required:
        - label
        - destination

    CompletenessReport:
      type: object
      properties:
        required:
          type: array
          items:
            $ref: "#/components/schemas/MissingField"
          description: Required fields that are missing — blocks research if non-empty
        recommended:
          type: array
          items:
            $ref: "#/components/schemas/MissingField"
          description: Recommended fields that are missing — shows warning but allows proceeding
        optional:
          type: array
          items:
            type: string
          description: Optional fields that are not filled in (labels only)
        blocking:
          type: boolean
          description: true if any required fields are missing
        researchMode:
          type: string
          enum: [personalised, generic]
          description: >
            Derived research mode. "personalised" when no required fields are missing;
            "generic" when blocking fields remain (research proceeds with generic prompts).
      required:
        - required
        - recommended
        - optional
        - blocking
        - researchMode

    CompletenessError:
      type: object
      properties:
        error:
          type: string
        missing:
          type: array
          items:
            type: string
        completenessReport:
          $ref: "#/components/schemas/CompletenessReport"
      required:
        - error
        - missing
        - completenessReport

