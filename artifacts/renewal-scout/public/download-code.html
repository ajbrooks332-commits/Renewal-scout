OpenAI API for processing \u2014 it is not stored by Renewal Scout.\n          </CardDescription>\n        </CardHeader>\n        <CardContent>\n          <div className=\"flex items-center gap-3\">\n            <input\n              ref={fileRef}\n              type=\"file\"\n              accept=\".pdf,.jpg,.jpeg,.png\"\n              className=\"hidden\"\n              onChange={handleFileChange}\n            />\n            <Button\n              variant=\"outline\"\n              onClick={() => fileRef.current?.click()}\n              disabled={isUploading}\n              className=\"gap-2\"\n            >\n              {isUploading ? <Loader2 className=\"h-4 w-4 animate-spin\" /> : <Upload className=\"h-4 w-4\" />}\n              {isUploading ? \"Extracting\u2026\" : \"Upload document\"}\n            </Button>\n            <span className=\"text-xs text-muted-foreground\">PDF, JPG, PNG \u00b7 max 10 MB</span>\n          </div>\n          <p className=\"text-xs text-muted-foreground mt-3 flex gap-1.5\">\n            <Info className=\"h-3.5 w-3.5 shrink-0 mt-0.5\" />\n            No credentials, bank details, or sensitive personal information should appear in uploaded documents.\n          </p>\n        </CardContent>\n      </Card>\n\n      {/* Current deal fields display */}\n      {hasAny ? (\n        <Card>\n          <CardHeader>\n            <div className=\"flex items-center justify-between\">\n              <div>\n                <CardTitle>Current Deal Details</CardTitle>\n                <CardDescription>\n                  Only confirmed fields (entered by you or verified from a document) are used in research.\n                </CardDescription>\n              </div>\n              <Button\n                variant=\"outline\"\n                size=\"sm\"\n                onClick={() => setEditMode(!editMode)}\n                className=\"gap-2\"\n              >\n                <Pencil className=\"h-3.5 w-3.5\" />\n                {editMode ? \"Cancel\" : \"Edit\"}\n              </Button>\n            </div>\n          </CardHeader>\n          <CardContent>\n            {editMode ? (\n              <ManualDealEditor\n                serviceId={serviceId}\n                fields={fields}\n                onSaved={() => {\n                  setEditMode(false);\n                  queryClient.invalidateQueries({ queryKey: getGetCurrentDealQueryKey(serviceId) });\n                }}\n              />\n            ) : (\n              <div className=\"space-y-4\">\n                {confirmedFields.length > 0 && (\n                  <div>\n                    <h4 className=\"text-sm font-medium mb-2 text-foreground\">Confirmed</h4>\n                    <div className=\"divide-y divide-border border rounded-md\">\n                      {confirmedFields.map(([key, pf]) => {\n                        const def = FIELD_DEFS.find((f) => f.key === key);\n                        return (\n                          <div key={key} className=\"flex items-center justify-between p-3 gap-4\">\n                            <span className=\"text-sm text-muted-foreground\">{def?.label ?? key}</span>\n                            <div className=\"flex items-center gap-2\">\n                              <span className=\"text-sm font-medium\">{String(pf.value)}</span>\n                              <ProvenanceBadge source={pf.source} />\n                            </div>\n                          </div>\n                        );\n                      })}\n                    </div>\n                  </div>\n                )}\n                {unconfirmedFields.length > 0 && (\n                  <div>\n                    <h4 className=\"text-sm font-medium mb-2 text-amber-700\">Pending confirmation</h4>\n                    <div className=\"divide-y divide-border border rounded-md\">\n                      {unconfirmedFields.map(([key, pf]) => {\n                        const def = FIELD_DEFS.find((f) => f.key === key);\n                        return (\n                          <div key={key} className=\"flex items-center justify-between p-3 gap-4\">\n                            <span className=\"text-sm text-muted-foreground\">{def?.label ?? key}</span>\n                            <div className=\"flex items-center gap-2\">\n                              <span className=\"text-sm font-medium text-amber-700\">{String(pf.value)}</span>\n                              <ProvenanceBadge source={pf.source} />\n                            </div>\n                          </div>\n                        );\n                      })}\n                    </div>\n                    <p className=\"text-xs text-amber-700 mt-2\">\n                      Unconfirmed values won't be used in research. Upload a new document to re-confirm.\n                    </p>\n                  </div>\n                )}\n              </div>\n            )}\n          </CardContent>\n        </Card>\n      ) : (\n        <Card>\n          <CardContent className=\"py-8 text-center\">\n            <FileText className=\"h-10 w-10 text-muted-foreground mx-auto mb-3\" />\n            <p className=\"text-sm text-muted-foreground mb-4\">No current deal details saved yet.</p>\n            <Button\n              variant=\"outline\"\n              onClick={() => setEditMode(true)}\n              className=\"gap-2\"\n            >\n              <Pencil className=\"h-4 w-4\" />\n              Enter manually\n            </Button>\n            {editMode && (\n              <div className=\"mt-4 text-left\">\n                <ManualDealEditor\n                  serviceId={serviceId}\n                  fields={fields}\n                  onSaved={() => {\n                    setEditMode(false);\n                    queryClient.invalidateQueries({ queryKey: getGetCurrentDealQueryKey(serviceId) });\n                  }}\n                />\n              </div>\n            )}\n          </CardContent>\n        </Card>\n      )}\n    </div>\n  );\n}\n\n\n============================================================\nFILE: artifacts/renewal-scout/src/pages/dashboard.tsx\n============================================================\nimport { useQueryClient } from \"@tanstack/react-query\";\nimport { Link, useLocation } from \"wouter\";\nimport { \n  useGetDashboardStats, \n  useListServices, \n  useListResearchRuns,\n  useRunDueCheck,\n  getListServicesQueryKey,\n  getListResearchRunsQueryKey\n} from \"@workspace/api-client-react\";\nimport { formatGbp, formatDate, formatDateTime } from \"@/lib/format\";\nimport { Button } from \"@/components/ui/button\";\nimport { Card, CardContent, CardHeader, CardTitle, CardDescription } from \"@/components/ui/card\";\nimport { Badge } from \"@/components/ui/badge\";\nimport { Table, TableBody, TableCell, TableHead, TableHeader, TableRow } from \"@/components/ui/table\";\nimport { Activity, Clock, ShieldCheck, Wallet, ArrowRight, Play, Plus, ServerCrash } from \"lucide-react\";\nimport { useToast } from \"@/hooks/use-toast\";\nimport { AppLayout } from \"@/components/layout\";\n\nexport default function DashboardPage() {\n  const [_, setLocation] = useLocation();\n  const { toast } = useToast();\n  const queryClient = useQueryClient();\n\n  const { data: stats } = useGetDashboardStats();\n  const { data: services } = useListServices();\n  const { data: runs } = useListResearchRuns();\n  \n  const runDueCheck = useRunDueCheck();\n\n  const handleDueCheck = () => {\n    runDueCheck.mutate(undefined, {\n      onSuccess: (res) => {\n        toast({\n          title: \"Due check complete\",\n          description: res.message,\n        });\n        queryClient.invalidateQueries({ queryKey: getListServicesQueryKey() });\n        queryClient.invalidateQueries({ queryKey: getListResearchRunsQueryKey() });\n      },\n      onError: (err) => {\n        toast({\n          title: \"Check failed\",\n          description: err.data?.error || \"Could not run due check\",\n          variant: \"destructive\"\n        });\n      }\n    });\n  };\n\n  const sortedServices = services ? [...services].sort((a, b) => {\n    // Sort by days remaining ascending, nulls at end\n    if (a.daysRemaining === null) return 1;\n    if (b.daysRemaining === null) return -1;\n    return a.daysRemaining - b.daysRemaining;\n  }) : [];\n\n  const getUrgencyChip = (days: number | null) => {\n    if (days === null) return <Badge variant=\"secondary\" className=\"font-normal text-muted-foreground bg-muted\">No date</Badge>;\n    if (days < 0) return <Badge variant=\"destructive\" className=\"font-medium\">Overdue</Badge>;\n    if (days <= 30) return <Badge variant=\"default\" className=\"bg-amber-500 hover:bg-amber-600 text-white font-medium\">{days} days</Badge>;\n    return <Badge variant=\"secondary\" className=\"font-normal\">{days} days</Badge>;\n  };\n\n  const getRunStatusColor = (status: string) => {\n    switch(status) {\n      case \"queued\": return \"text-blue-500 bg-blue-50 dark:bg-blue-950 border-blue-200\";\n      case \"running\": return \"text-blue-600 bg-blue-100 dark:bg-blue-900 border-blue-300 animate-pulse\";\n      case \"complete\": return \"text-emerald-600 bg-emerald-50 dark:bg-emerald-950 border-emerald-200\";\n      case \"failed\": return \"text-destructive bg-destructive/10 border-destructive/20\";\n      default: return \"text-muted-foreground bg-muted border-border\";\n    }\n  };\n\n  return (\n    <AppLayout>\n      <div className=\"flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4\">\n        <div>\n          <h1 className=\"text-3xl font-bold tracking-tight text-foreground\">Dashboard</h1>\n          <p className=\"text-muted-foreground mt-1\">Overview of your household services and renewals</p>\n        </div>\n        <div className=\"flex items-center gap-3\">\n          <Button \n            variant=\"outline\" \n            onClick={handleDueCheck} \n            disabled={runDueCheck.isPending}\n            className=\"gap-2\"\n          >\n            <Play className=\"h-4 w-4\" />\n            {runDueCheck.isPending ? \"Checking...\" : \"Run due check\"}\n          </Button>\n          <Button onClick={() => setLocation(\"/services/new\")} className=\"gap-2\">\n            <Plus className=\"h-4 w-4\" />\n            Add service\n          </Button>\n        </div>\n      </div>\n\n      <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8\">\n        <Card className=\"shadow-sm\">\n          <CardHeader className=\"flex flex-row items-center justify-between pb-2\">\n            <CardTitle className=\"text-sm font-medium text-muted-foreground\">Tracked Services</CardTitle>\n            <ShieldCheck className=\"h-4 w-4 text-primary\" />\n          </CardHeader>\n          <CardContent>\n            <div className=\"text-2xl font-bold\">{stats?.totalServices ?? \"\u2014\"}</div>\n          </CardContent>\n        </Card>\n        \n        <Card className=\"shadow-sm\">\n          <CardHeader className=\"flex flex-row items-center justify-between pb-2\">\n            <CardTitle className=\"text-sm font-medium text-muted-foreground\">Estimated Annual</CardTitle>\n            <Wallet className=\"h-4 w-4 text-primary\" />\n          </CardHeader>\n          <CardContent>\n            <div className=\"text-2xl font-bold\">{formatGbp(stats?.totalAnnualCostGbp)}</div>\n          </CardContent>\n        </Card>\n\n        <Card className=\"shadow-sm\">\n          <CardHeader className=\"flex flex-row items-center justify-between pb-2\">\n            <CardTitle className=\"text-sm font-medium text-muted-foreground\">Within 90 Days</CardTitle>\n            <Clock className=\"h-4 w-4 text-amber-500\" />\n          </CardHeader>\n          <CardContent>\n            <div className=\"text-2xl font-bold text-amber-600 dark:text-amber-500\">{stats?.withinNinetyDays ?? \"\u2014\"}</div>\n          </CardContent>\n        </Card>\n\n        <Card className=\"shadow-sm\">\n          <CardHeader className=\"flex flex-row items-center justify-between pb-2\">\n            <CardTitle className=\"text-sm font-medium text-muted-foreground\">Due Now</CardTitle>\n            <Activity className=\"h-4 w-4 text-destructive\" />\n          </CardHeader>\n          <CardContent>\n            <div className=\"text-2xl font-bold text-destructive\">{stats?.dueNow ?? \"\u2014\"}</div>\n          </CardContent>\n        </Card>\n      </div>\n\n      <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-8\">\n        <div className=\"lg:col-span-2 space-y-4\">\n          <h2 className=\"text-xl font-semibold tracking-tight\">Active Services</h2>\n          <Card className=\"shadow-sm overflow-hidden\">\n            <Table>\n              <TableHeader className=\"bg-muted/50\">\n                <TableRow>\n                  <TableHead>Service</TableHead>\n                  <TableHead>Provider</TableHead>\n                  <TableHead>Annual Cost</TableHead>\n                  <TableHead>Renewal Date</TableHead>\n                  <TableHead>Urgency</TableHead>\n                  <TableHead className=\"w-[50px]\"></TableHead>\n                </TableRow>\n              </TableHeader>\n              <TableBody>\n                {sortedServices.length === 0 ? (\n                  <TableRow>\n                    <TableCell colSpan={6} className=\"h-32 text-center text-muted-foreground\">\n                      No services tracked yet. Click \"Add service\" to begin.\n                    </TableCell>\n                  </TableRow>\n                ) : (\n                  sortedServices.map((service) => (\n                    <TableRow \n                      key={service.id} \n                      className=\"cursor-pointer hover:bg-muted/30 transition-colors group\"\n                      onClick={() => setLocation(`/services/${service.id}`)}\n                    >\n                      <TableCell className=\"font-medium\">{service.serviceType}</TableCell>\n                      <TableCell>{service.provider}</TableCell>\n                      <TableCell>{formatGbp(service.annualCostGbp)}</TableCell>\n                      <TableCell>{formatDate(service.renewalDate)}</TableCell>\n                      <TableCell>{getUrgencyChip(service.daysRemaining)}</TableCell>\n                      <TableCell>\n                        <ArrowRight className=\"h-4 w-4 text-muted-foreground opacity-0 group-hover:opacity-100 transition-opacity\" />\n                      </TableCell>\n                    </TableRow>\n                  ))\n                )}\n              </TableBody>\n            </Table>\n          </Card>\n        </div>\n\n        <div className=\"space-y-4\">\n          <h2 className=\"text-xl font-semibold tracking-tight\">Recent Research</h2>\n          <Card className=\"shadow-sm\">\n            <CardContent className=\"p-0\">\n              <div className=\"divide-y divide-border\">\n                {(!runs || runs.length === 0) ? (\n                  <div className=\"p-6 text-center text-sm text-muted-foreground\">\n                    No research runs yet.\n                  </div>\n                ) : (\n                  runs.slice(0, 8).map(run => (\n                    <div key={run.id} className=\"p-4 hover:bg-muted/30 transition-colors\">\n                      <div className=\"flex items-start justify-between gap-4\">\n                        <div className=\"min-w-0\">\n                          <Link href={`/services/${run.serviceId}`} className=\"font-medium hover:underline text-sm truncate block\">\n                            {run.serviceName}\n                          </Link>\n                          <div className=\"text-xs text-muted-foreground mt-1 flex items-center gap-2\">\n                            <span>{formatDateTime(run.createdAt)}</span>\n                            <span>&bull;</span>\n                            <span className=\"capitalize\">{run.trigger}</span>\n                          </div>\n                        </div>\n                        <Badge variant=\"outline\" className={`capitalize text-xs font-medium ${getRunStatusColor(run.status)}`}>\n                          {run.status}\n                        </Badge>\n                      </div>\n                      {run.error && (\n                        <div className=\"mt-2 text-xs text-destructive flex items-start gap-1 bg-destructive/5 p-2 rounded border border-destructive/10\">\n                          <ServerCrash className=\"h-3 w-3 mt-0.5 shrink-0\" />\n                          <span className=\"break-words\">{run.error}</span>\n                        </div>\n                      )}\n                    </div>\n                  ))\n                )}\n              </div>\n            </CardContent>\n          </Card>\n        </div>\n      </div>\n    </AppLayout>\n  );\n}\n\n\n============================================================\nFILE: artifacts/renewal-scout/src/pages/household.tsx\n============================================================\nimport { useState, useEffect } from \"react\";\nimport { useLocation } from \"wouter\";\nimport { useGetHouseholdProfile, useUpdateHouseholdProfile } from \"@workspace/api-client-react\";\nimport { AppLayout } from \"@/components/layout\";\nimport { Button } from \"@/components/ui/button\";\nimport { Input } from \"@/components/ui/input\";\nimport { Card, CardContent, CardHeader, CardTitle, CardDescription } from \"@/components/ui/card\";\nimport { Label } from \"@/components/ui/label\";\nimport { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from \"@/components/ui/select\";\nimport { Textarea } from \"@/components/ui/textarea\";\nimport { useToast } from \"@/hooks/use-toast\";\nimport {\n  ChevronLeft, ChevronRight, CheckCircle, Home, Zap, Car, Tv, Save, Loader2\n} from \"lucide-react\";\n\n// \u2500\u2500\u2500 Step definitions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nconst STEPS = [\n  { id: \"location\", label: \"Location\", icon: Home },\n  { id: \"household\", label: \"Household\", icon: Home },\n  { id: \"energy\", label: \"Energy & EV\", icon: Zap },\n  { id: \"vehicles\", label: \"Vehicles\", icon: Car },\n  { id: \"bundles\", label: \"Bundles & Other\", icon: Tv },\n  { id: \"review\", label: \"Review & Save\", icon: CheckCircle },\n];\n\n// \u2500\u2500\u2500 Types \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ntype ProfileDraft = {\n  postcode: string | null;\n  propertyType: string | null;\n  tenure: string | null;\n  bedrooms: number | null;\n  yearBuilt: number | null;\n  numAdults: number | null;\n  numChildren: number | null;\n  heatingType: string | null;\n  hasEv: boolean | null;\n  evChargerType: string | null;\n  hasSolar: boolean | null;\n  solarExportTariff: string | null;\n  annualElectricityKwh: number | null;\n  annualGasKwh: number | null;\n  numCars: number | null;\n  carMake: string | null;\n  carModel: string | null;\n  carYear: number | null;\n  carValue: number | null;\n  annualMileage: number | null;\n  drivingExperience: string | null;\n  claimsLast5Years: number | null;\n  hasSkyTv: boolean | null;\n  hasSkyMobile: boolean | null;\n  hasVirginMedia: boolean | null;\n  smoker: boolean | null;\n  accessibilityNeeds: string | null;\n  generalPreferences: string | null;\n};\n\nconst EMPTY: ProfileDraft = {\n  postcode: null, propertyType: null, tenure: null, bedrooms: null,\n  yearBuilt: null, numAdults: null, numChildren: null,\n  heatingType: null, hasEv: null, evChargerType: null,\n  hasSolar: null, solarExportTariff: null,\n  annualElectricityKwh: null, annualGasKwh: null,\n  numCars: null, carMake: null, carModel: null, carYear: null,\n  carValue: null, annualMileage: null, drivingExperience: null,\n  claimsLast5Years: null,\n  hasSkyTv: null, hasSkyMobile: null, hasVirginMedia: null,\n  smoker: null, accessibilityNeeds: null, generalPreferences: null,\n};\n\n// \u2500\u2500\u2500 Helper components \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nfunction FieldLabel({ children, hint }: { children: React.ReactNode; hint?: string }) {\n  return (\n    <div className=\"mb-1\">\n      <Label className=\"text-sm font-medium\">{children}</Label>\n      {hint && <p className=\"text-xs text-muted-foreground mt-0.5\">{hint}</p>}\n    </div>\n  );\n}\n\nfunction SelectField({\n  value, onChange, options, placeholder = \"Select\u2026\", allowUnknown = true,\n}: {\n  value: string | null;\n  onChange: (v: string | null) => void;\n  options: { value: string; label: string }[];\n  placeholder?: string;\n  allowUnknown?: boolean;\n}) {\n  return (\n    <Select\n      value={value ?? \"__unknown__\"}\n      onValueChange={(v) => onChange(v === \"__unknown__\" ? null : v)}\n    >\n      <SelectTrigger>\n        <SelectValue placeholder={placeholder} />\n      </SelectTrigger>\n      <SelectContent>\n        {allowUnknown && (\n          <SelectItem value=\"__unknown__\">I don't know / prefer not to say</SelectItem>\n        )}\n        {options.map((o) => (\n          <SelectItem key={o.value} value={o.value}>{o.label}</SelectItem>\n        ))}\n      </SelectContent>\n    </Select>\n  );\n}\n\nfunction YesNoField({\n  value, onChange,\n}: {\n  value: boolean | null;\n  onChange: (v: boolean | null) => void;\n}) {\n  return (\n    <Select\n      value={value === null ? \"__unknown__\" : value ? \"yes\" : \"no\"}\n      onValueChange={(v) =>\n        onChange(v === \"__unknown__\" ? null : v === \"yes\")\n      }\n    >\n      <SelectTrigger>\n        <SelectValue />\n      </SelectTrigger>\n      <SelectContent>\n        <SelectItem value=\"__unknown__\">I don't know</SelectItem>\n        <SelectItem value=\"yes\">Yes</SelectItem>\n        <SelectItem value=\"no\">No</SelectItem>\n      </SelectContent>\n    </Select>\n  );\n}\n\nfunction NumberField({\n  value, onChange, placeholder, min, max,\n}: {\n  value: number | null;\n  onChange: (v: number | null) => void;\n  placeholder?: string;\n  min?: number;\n  max?: number;\n}) {\n  return (\n    <Input\n      type=\"number\"\n      placeholder={placeholder ?? \"Leave blank if unknown\"}\n      value={value ?? \"\"}\n      min={min}\n      max={max}\n      onChange={(e) => {\n        const v = e.target.value;\n        onChange(v === \"\" ? null : Number(v));\n      }}\n    />\n  );\n}\n\n// \u2500\u2500\u2500 Step views \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nfunction LocationStep({ draft, set }: { draft: ProfileDraft; set: (k: keyof ProfileDraft, v: unknown) => void }) {\n  return (\n    <div className=\"space-y-5\">\n      <div>\n        <FieldLabel hint=\"Used for broadband, energy, and home insurance research\">Postcode</FieldLabel>\n        <Input\n          placeholder=\"e.g. SW1A 1AA\"\n          value={draft.postcode ?? \"\"}\n          maxLength={10}\n          onChange={(e) => set(\"postcode\", e.target.value.toUpperCase() || null)}\n        />\n      </div>\n      <div>\n        <FieldLabel>Property type</FieldLabel>\n        <SelectField\n          value={draft.propertyType}\n          onChange={(v) => set(\"propertyType\", v)}\n          options={[\n            { value: \"detached\", label: \"Detached house\" },\n            { value: \"semi-detached\", label: \"Semi-detached house\" },\n            { value: \"terraced\", label: \"Terraced house\" },\n            { value: \"flat\", label: \"Flat / apartment\" },\n            { value: \"bungalow\", label: \"Bungalow\" },\n            { value: \"other\", label: \"Other\" },\n          ]}\n        />\n      </div>\n      <div>\n        <FieldLabel>Tenure</FieldLabel>\n        <SelectField\n          value={draft.tenure}\n          onChange={(v) => set(\"tenure\", v)}\n          options={[\n            { value: \"owner\", label: \"Owner-occupier\" },\n            { value: \"tenant\", label: \"Renting\" },\n            { value: \"other\", label: \"Other\" },\n          ]}\n        />\n      </div>\n      <div>\n        <FieldLabel>Number of bedrooms</FieldLabel>\n        <NumberField value={draft.bedrooms} onChange={(v) => set(\"bedrooms\", v)} min={1} max={20} />\n      </div>\n      <div>\n        <FieldLabel hint=\"Helps with home insurance rebuild value estimates\">Year built (approximate)</FieldLabel>\n        <NumberField value={draft.yearBuilt} onChange={(v) => set(\"yearBuilt\", v)} placeholder=\"e.g. 1960\" min={1800} max={2030} />\n      </div>\n    </div>\n  );\n}\n\nfunction HouseholdStep({ draft, set }: { draft: ProfileDraft; set: (k: keyof ProfileDraft, v: unknown) => void }) {\n  return (\n    <div className=\"space-y-5\">\n      <div>\n        <FieldLabel hint=\"Helps estimate broadband and energy usage\">Number of adults</FieldLabel>\n        <NumberField value={draft.numAdults} onChange={(v) => set(\"numAdults\", v)} min={1} max={20} />\n      </div>\n      <div>\n        <FieldLabel>Number of children</FieldLabel>\n        <NumberField value={draft.numChildren} onChange={(v) => set(\"numChildren\", v)} min={0} max={20} placeholder=\"0 if none\" />\n      </div>\n      <div>\n        <FieldLabel hint=\"Used for energy research\">Primary heating type</FieldLabel>\n        <SelectField\n          value={draft.heatingType}\n          onChange={(v) => set(\"heatingType\", v)}\n          options={[\n            { value: \"gas\", label: \"Gas central heating\" },\n            { value: \"electric\", label: \"Electric heating\" },\n            { value: \"oil\", label: \"Oil\" },\n            { value: \"heat_pump\", label: \"Heat pump\" },\n            { value: \"other\", label: \"Other\" },\n          ]}\n        />\n      </div>\n    </div>\n  );\n}\n\nfunction EnergyStep({ draft, set }: { draft: ProfileDraft; set: (k: keyof ProfileDraft, v: unknown) => void }) {\n  return (\n    <div className=\"space-y-5\">\n      <div>\n        <FieldLabel hint=\"Check your energy bill for kWh used in the past 12 months\">Annual electricity usage (kWh)</FieldLabel>\n        <NumberField value={draft.annualElectricityKwh} onChange={(v) => set(\"annualElectricityKwh\", v)} placeholder=\"e.g. 3100\" />\n      </div>\n      <div>\n        <FieldLabel>Annual gas usage (kWh)</FieldLabel>\n        <NumberField value={draft.annualGasKwh} onChange={(v) => set(\"annualGasKwh\", v)} placeholder=\"e.g. 12000\" />\n      </div>\n      <div>\n        <FieldLabel>Do you have solar panels?</FieldLabel>\n        <YesNoField value={draft.hasSolar} onChange={(v) => set(\"hasSolar\", v)} />\n      </div>\n      {draft.hasSolar && (\n        <div>\n          <FieldLabel>Solar export tariff name (if known)</FieldLabel>\n          <Input\n            value={draft.solarExportTariff ?? \"\"}\n            onChange={(e) => set(\"solarExportTariff\", e.target.value || null)}\n            placeholder=\"e.g. SEG tariff\"\n          />\n        </div>\n      )}\n      <div>\n        <FieldLabel hint=\"Used for energy tariff research \u2014 EV charging can significantly affect the best tariff\">Do you have an electric vehicle (EV)?</FieldLabel>\n        <YesNoField value={draft.hasEv} onChange={(v) => set(\"hasEv\", v)} />\n      </div>\n      {draft.hasEv && (\n        <div>\n          <FieldLabel>Home charger power</FieldLabel>\n          <SelectField\n            value={draft.evChargerType}\n            onChange={(v) => set(\"evChargerType\", v)}\n            options={[\n              { value: \"7kw\", label: \"7 kW (standard home charger)\" },\n              { value: \"22kw\", label: \"22 kW (fast home charger)\" },\n              { value: \"none\", label: \"No home charger\" },\n            ]}\n          />\n        </div>\n      )}\n    </div>\n  );\n}\n\nfunction VehiclesStep({ draft, set }: { draft: ProfileDraft; set: (k: keyof ProfileDraft, v: unknown) => void }) {\n  return (\n    <div className=\"space-y-5\">\n      <div>\n        <FieldLabel>Number of cars in household</FieldLabel>\n        <NumberField value={draft.numCars} onChange={(v) => set(\"numCars\", v)} min={0} max={10} />\n      </div>\n      {(draft.numCars ?? 0) > 0 && (\n        <>\n          <div className=\"grid grid-cols-2 gap-4\">\n            <div>\n              <FieldLabel>Car make</FieldLabel>\n              <Input value={draft.carMake ?? \"\"} onChange={(e) => set(\"carMake\", e.target.value || null)} placeholder=\"e.g. Ford\" />\n            </div>\n            <div>\n              <FieldLabel>Car model</FieldLabel>\n              <Input value={draft.carModel ?? \"\"} onChange={(e) => set(\"carModel\", e.target.value || null)} placeholder=\"e.g. Focus\" />\n            </div>\n          </div>\n          <div className=\"grid grid-cols-2 gap-4\">\n            <div>\n              <FieldLabel>Year of manufacture</FieldLabel>\n              <NumberField value={draft.carYear} onChange={(v) => set(\"carYear\", v)} placeholder=\"e.g. 2019\" min={1950} max={2030} />\n            </div>\n            <div>\n              <FieldLabel>Estimated car value (\u00a3)</FieldLabel>\n              <NumberField value={draft.carValue} onChange={(v) => set(\"carValue\", v)} placeholder=\"e.g. 8000\" />\n            </div>\n          </div>\n          <div>\n            <FieldLabel hint=\"Used to calculate insurance premiums\">Annual mileage</FieldLabel>\n            <NumberField value={draft.annualMileage} onChange={(v) => set(\"annualMileage\", v)} placeholder=\"e.g. 8000\" />\n          </div>\n          <div>\n            <FieldLabel>Driving experience</FieldLabel>\n            <SelectField\n              value={draft.drivingExperience}\n              onChange={(v) => set(\"drivingExperience\", v)}\n              options={[\n                { value: \"new_driver\", label: \"New driver (< 1 year)\" },\n                { value: \"lt5yrs\", label: \"1\u20134 years\" },\n                { value: \"5_10yrs\", label: \"5\u20139 years\" },\n                { value: \"10plus\", label: \"10+ years\" },\n              ]}\n            />\n          </div>\n          <div>\n            <FieldLabel hint=\"At-fault claims only\">At-fault claims in last 5 years</FieldLabel>\n            <NumberField value={draft.claimsLast5Years} onChange={(v) => set(\"claimsLast5Years\", v)} min={0} max={20} placeholder=\"0 if none\" />\n          </div>\n        </>\n      )}\n    </div>\n  );\n}\n\nfunction BundlesStep({ draft, set }: { draft: ProfileDraft; set: (k: keyof ProfileDraft, v: unknown) => void }) {\n  return (\n    <div className=\"space-y-5\">\n      <p className=\"text-sm text-muted-foreground\">\n        Bundle information helps the AI identify deals that include Sky or Virgin Media discounts when researching broadband or mobile.\n      </p>\n      <div>\n        <FieldLabel>Do you have a Sky TV subscription?</FieldLabel>\n        <YesNoField value={draft.hasSkyTv} onChange={(v) => set(\"hasSkyTv\", v)} />\n      </div>\n      <div>\n        <FieldLabel>Do you have a Sky Mobile subscription?</FieldLabel>\n        <YesNoField value={draft.hasSkyMobile} onChange={(v) => set(\"hasSkyMobile\", v)} />\n      </div>\n      <div>\n        <FieldLabel>Do you have Virgin Media (any product)?</FieldLabel>\n        <YesNoField value={draft.hasVirginMedia} onChange={(v) => set(\"hasVirginMedia\", v)} />\n      </div>\n      <div className=\"border-t pt-5\">\n        <FieldLabel hint=\"Used only for life insurance research to find appropriate cover amounts\">Are you a smoker?</FieldLabel>\n        <YesNoField value={draft.smoker} onChange={(v) => set(\"smoker\", v)} />\n      </div>\n      <div>\n        <FieldLabel hint=\"e.g. step-free access required, large-print communications\">Accessibility needs</FieldLabel>\n        <Textarea\n          value={draft.accessibilityNeeds ?? \"\"}\n          onChange={(e) => set(\"accessibilityNeeds\", e.target.value || null)}\n          placeholder=\"Leave blank if none\"\n          className=\"min-h-[80px]\"\n        />\n      </div>\n      <div>\n        <FieldLabel>General preferences for all services</FieldLabel>\n        <Textarea\n          value={draft.generalPreferences ?? \"\"}\n          onChange={(e) => set(\"generalPreferences\", e.target.value || null)}\n          placeholder=\"e.g. prefer direct debit, no cashback cards, green energy preferred\"\n          className=\"min-h-[80px]\"\n        />\n      </div>\n    </div>\n  );\n}\n\nfunction ReviewStep({ draft }: { draft: ProfileDraft }) {\n  const rows: { label: string; value: unknown }[] = [\n    { label: \"Postcode\", value: draft.postcode },\n    { label: \"Property type\", value: draft.propertyType },\n    { label: \"Tenure\", value: draft.tenure },\n    { label: \"Bedrooms\", value: draft.bedrooms },\n    { label: \"Year built\", value: draft.yearBuilt },\n    { label: \"Adults\", value: draft.numAdults },\n    { label: \"Children\", value: draft.numChildren },\n    { label: \"Heating\", value: draft.heatingType },\n    { label: \"Annual electricity (kWh)\", value: draft.annualElectricityKwh },\n    { label: \"Annual gas (kWh)\", value: draft.annualGasKwh },\n    { label: \"Solar panels\", value: draft.hasSolar === null ? null : draft.hasSolar ? \"Yes\" : \"No\" },\n    { label: \"EV\", value: draft.hasEv === null ? null : draft.hasEv ? \"Yes\" : \"No\" },\n    { label: \"EV charger\", value: draft.evChargerType },\n    { label: \"Cars\", value: draft.numCars },\n    { label: \"Car make/model\", value: draft.carMake && draft.carModel ? `${draft.carMake} ${draft.carModel} (${draft.carYear ?? \"year unknown\"})` : null },\n    { label: \"Annual mileage\", value: draft.annualMileage },\n    { label: \"Claims (5yr)\", value: draft.claimsLast5Years },\n    { label: \"Sky TV\", value: draft.hasSkyTv === null ? null : draft.hasSkyTv ? \"Yes\" : \"No\" },\n    { label: \"Sky Mobile\", value: draft.hasSkyMobile === null ? null : draft.hasSkyMobile ? \"Yes\" : \"No\" },\n    { label: \"Virgin Media\", value: draft.hasVirginMedia === null ? null : draft.hasVirginMedia ? \"Yes\" : \"No\" },\n    { label: \"Smoker\", value: draft.smoker === null ? null : draft.smoker ? \"Yes\" : \"No\" },\n  ];\n\n  const filled = rows.filter((r) => r.value !== null && r.value !== undefined);\n\n  return (\n    <div className=\"space-y-4\">\n      <p className=\"text-sm text-muted-foreground\">\n        Review what you've entered. Blank fields won't be included in research \u2014 that's fine, the AI will note when it couldn't personalise.\n      </p>\n      <div className=\"divide-y divide-border rounded-md border\">\n        {filled.length === 0 ? (\n          <p className=\"p-4 text-sm text-muted-foreground\">No fields filled in yet.</p>\n        ) : (\n          filled.map((r) => (\n            <div key={r.label} className=\"flex justify-between items-center p-3 text-sm\">\n              <span className=\"text-muted-foreground\">{r.label}</span>\n              <span className=\"font-medium\">{String(r.value)}</span>\n            </div>\n          ))\n        )}\n      </div>\n      <p className=\"text-xs text-muted-foreground\">\n        Sensitive data (credentials, financial details, driving licence numbers) should never be entered here.\n        Click Save Profile to store your answers.\n      </p>\n    </div>\n  );\n}\n\n// \u2500\u2500\u2500 Main page \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport default function HouseholdPage() {\n  const [_, setLocation] = useLocation();\n  const { toast } = useToast();\n  const [step, setStep] = useState(0);\n  const [draft, setDraft] = useState<ProfileDraft>(EMPTY);\n  const [saved, setSaved] = useState(false);\n\n  const { data: profile, isLoading } = useGetHouseholdProfile();\n  const update = useUpdateHouseholdProfile();\n\n  // Load existing profile into draft on mount\n  useEffect(() => {\n    if (!profile) return;\n    setDraft({\n      postcode: profile.postcode ?? null,\n      propertyType: profile.propertyType ?? null,\n      tenure: profile.tenure ?? null,\n      bedrooms: profile.bedrooms ?? null,\n      yearBuilt: profile.yearBuilt ?? null,\n      numAdults: profile.numAdults ?? null,\n      numChildren: profile.numChildren ?? null,\n      heatingType: profile.heatingType ?? null,\n      hasEv: profile.hasEv ?? null,\n      evChargerType: profile.evChargerType ?? null,\n      hasSolar: profile.hasSolar ?? null,\n      solarExportTariff: profile.solarExportTariff ?? null,\n      annualElectricityKwh: profile.annualElectricityKwh ?? null,\n      annualGasKwh: profile.annualGasKwh ?? null,\n      numCars: profile.numCars ?? null,\n      carMake: profile.carMake ?? null,\n      carModel: profile.carModel ?? null,\n      carYear: profile.carYear ?? null,\n      carValue: profile.carValue ?? null,\n      annualMileage: profile.annualMileage ?? null,\n      drivingExperience: profile.drivingExperience ?? null,\n      claimsLast5Years: profile.claimsLast5Years ?? null,\n      hasSkyTv: profile.hasSkyTv ?? null,\n      hasSkyMobile: profile.hasSkyMobile ?? null,\n      hasVirginMedia: profile.hasVirginMedia ?? null,\n      smoker: profile.smoker ?? null,\n      accessibilityNeeds: profile.accessibilityNeeds ?? null,\n      generalPreferences: profile.generalPreferences ?? null,\n    });\n  }, [profile?.updatedAt]);\n\n  function set(key: keyof ProfileDraft, value: unknown) {\n    setSaved(false);\n    setDraft((d) => ({ ...d, [key]: value }));\n  }\n\n  function handleSave() {\n    update.mutate({ data: draft as Parameters<typeof update.mutate>[0][\"data\"] }, {\n      onSuccess: () => {\n        setSaved(true);\n        toast({ title: \"Household profile saved\" });\n      },\n      onError: (err) => {\n        toast({ title: \"Failed to save\", description: (err as { data?: { error?: string } }).data?.error ?? \"Unknown error\", variant: \"destructive\" });\n      },\n    });\n  }\n\n  function handleSaveLater() {\n    update.mutate({ data: draft as Parameters<typeof update.mutate>[0][\"data\"] }, {\n      onSuccess: () => {\n        setSaved(true);\n        toast({ title: \"Household profile saved\" });\n        setLocation(\"/\");\n      },\n      onError: (err) => {\n        toast({\n          title: \"Failed to save\",\n          description: (err as { data?: { error?: string } }).data?.error ?? \"Unknown error\",\n          variant: \"destructive\",\n        });\n        // Navigation is intentionally withheld on failure so the user can retry\n      },\n    });\n  }\n\n  const isLast = step === STEPS.length - 1;\n\n  const stepContent = () => {\n    switch (step) {\n      case 0: return <LocationStep draft={draft} set={set} />;\n      case 1: return <HouseholdStep draft={draft} set={set} />;\n      case 2: return <EnergyStep draft={draft} set={set} />;\n      case 3: return <VehiclesStep draft={draft} set={set} />;\n      case 4: return <BundlesStep draft={draft} set={set} />;\n      case 5: return <ReviewStep draft={draft} />;\n      default: return null;\n    }\n  };\n\n  if (isLoading) {\n    return (\n      <AppLayout>\n        <div className=\"flex items-center justify-center py-12\">\n          <Loader2 className=\"h-8 w-8 animate-spin text-muted-foreground\" />\n        </div>\n      </AppLayout>\n    );\n  }\n\n  const StepIcon = STEPS[step]!.icon;\n\n  return (\n    <AppLayout>\n      {/* Header */}\n      <div className=\"mb-8\">\n        <h1 className=\"text-3xl font-bold tracking-tight\">My Household</h1>\n        <p className=\"text-muted-foreground mt-1\">\n          Tell us about your household so the AI can personalise its research.\n          All fields are optional \u2014 leave anything you don't know blank.\n        </p>\n      </div>\n\n      {/* Progress bar */}\n      <div className=\"mb-8\">\n        <div className=\"flex items-center justify-between mb-2\">\n          {STEPS.map((s, i) => (\n            <button\n              key={s.id}\n              onClick={() => setStep(i)}\n              className={`flex flex-col items-center gap-1 text-xs font-medium transition-colors ${\n                i === step\n                  ? \"text-primary\"\n                  : i < step\n                  ? \"text-primary/70 cursor-pointer hover:text-primary\"\n                  : \"text-muted-foreground cursor-default\"\n              }`}\n            >\n              <span\n                className={`h-8 w-8 rounded-full flex items-center justify-center text-xs font-bold border-2 transitio ap-1.5\">\n                                  <span className=\"mt-0.5\">-</span>\n                                  <span>{ex}</span>\n                                </li>\n                              ))}\n                            </ul>\n                          </div>\n                        )}\n                      </CardContent>\n                      <CardFooter className=\"pt-4 border-t border-border/50 bg-muted/10\">\n                        <div className=\"w-full flex flex-wrap gap-2\">\n                          {opt.sourceUrls.map((url, j) => (\n                            <a key={j} href={url} target=\"_blank\" rel=\"noreferrer\" className=\"inline-flex items-center text-xs font-medium text-primary hover:underline\">\n                              Source <ExternalLink className=\"ml-1 h-3 w-3\" />\n                            </a>\n                          ))}\n                        </div>\n                      </CardFooter>\n                    </Card>\n                  ))}\n                </div>\n\n                <Card className=\"bg-emerald-50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-900/50 shadow-sm\">\n                  <CardContent className=\"p-5 flex gap-4\">\n                    <CheckSquare className=\"h-6 w-6 text-emerald-600 dark:text-emerald-500 shrink-0\" />\n                    <div>\n                      <h3 className=\"font-semibold text-emerald-900 dark:text-emerald-400\">Recommended Next Step</h3>\n                      <p className=\"text-emerald-800 dark:text-emerald-300 mt-1\">{latestReport.recommendedNextStep}</p>\n                    </div>\n                  </CardContent>\n                </Card>\n\n                <div className=\"grid grid-cols-1 md:grid-cols-3 gap-6\">\n                  {latestReport.missingInformation.length > 0 && (\n                    <div className=\"space-y-2\">\n                      <h4 className=\"font-medium flex items-center gap-2\"><Info className=\"h-4 w-4 text-blue-500\" /> Missing Info</h4>\n                      <ul className=\"text-sm space-y-1.5 text-muted-foreground pl-6 list-disc\">\n                        {latestReport.missingInformation.map((item, i) => <li key={i}>{item}</li>)}\n                      </ul>\n                    </div>\n                  )}\n                  {latestReport.comparisonChecklist.length > 0 && (\n                    <div className=\"space-y-2\">\n                      <h4 className=\"font-medium flex items-center gap-2\"><CheckSquare className=\"h-4 w-4 text-emerald-500\" /> Comparison Checklist</h4>\n                      <ul className=\"text-sm space-y-1.5 text-muted-foreground pl-6 list-disc\">\n                        {latestReport.comparisonChecklist.map((item, i) => <li key={i}>{item}</li>)}\n                      </ul>\n                    </div>\n                  )}\n                  {latestReport.applicationPack.length > 0 && (\n                    <div className=\"space-y-2\">\n                      <h4 className=\"font-medium flex items-center gap-2\"><FileText className=\"h-4 w-4 text-purple-500\" /> Application Pack</h4>\n                      <ul className=\"text-sm space-y-1.5 text-muted-foreground pl-6 list-disc\">\n                        {latestReport.applicationPack.map((item, i) => <li key={i}>{item}</li>)}\n                      </ul>\n                    </div>\n                  )}\n                </div>\n\n                {latestReport.warnings.length > 0 && (\n                  <div className=\"bg-destructive/10 border border-destructive/20 rounded-md p-4 space-y-2\">\n                    <h4 className=\"font-medium text-destructive flex items-center gap-2\"><AlertTriangle className=\"h-4 w-4\" /> Warnings</h4>\n                    <ul className=\"text-sm space-y-1 text-destructive/80 pl-6 list-disc\">\n                      {latestReport.warnings.map((w, i) => <li key={i}>{w}</li>)}\n                    </ul>\n                  </div>\n                )}\n\n                {/* Comparison based on \u2014 collapsible */}\n                {latestReport.comparisonBasedOn && latestReport.comparisonBasedOn.length > 0 && (\n                  <Collapsible open={comparisonOpen} onOpenChange={setComparisonOpen} className=\"border border-border rounded-md\">\n                    <CollapsibleTrigger className=\"flex items-center justify-between w-full p-4 font-medium hover:bg-muted/30 transition-colors\">\n                      <span className=\"flex items-center gap-2 text-sm\">\n                        <Info className=\"h-4 w-4 text-muted-foreground\" />\n                        Comparison based on\n                      </span>\n                      <ChevronDown className={`h-4 w-4 transition-transform ${comparisonOpen ? \"rotate-180\" : \"\"}`} />\n                    </CollapsibleTrigger>\n                    <CollapsibleContent className=\"p-4 pt-0 border-t border-border\">\n                      <ul className=\"space-y-1.5\">\n                        {latestReport.comparisonBasedOn.map((item, i) => (\n                          <li key={i} className=\"text-sm text-muted-foreground flex items-start gap-2\">\n                            <span className=\"text-primary mt-0.5\">\u2022</span>\n                            {item}\n                          </li>\n                        ))}\n                      </ul>\n                      {service.serviceType === \"Life insurance\" && (\n                        <p className=\"mt-3 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded p-2\">\n                          Life insurance: Always seek regulated financial advice before making changes.\n                          Never cancel existing cover before replacement cover is confirmed active.\n                        </p>\n                      )}\n                    </CollapsibleContent>\n                  </Collapsible>\n                )}\n\n                <Collapsible open={sourcesOpen} onOpenChange={setSourcesOpen} className=\"border border-border rounded-md\">\n                  <CollapsibleTrigger className=\"flex items-center justify-between w-full p-4 font-medium hover:bg-muted/30 transition-colors\">\n                    <span className=\"text-sm\">View all research sources</span>\n                    <ChevronDown className={`h-4 w-4 transition-transform ${sourcesOpen ? \"rotate-180\" : \"\"}`} />\n                  </CollapsibleTrigger>\n                  <CollapsibleContent className=\"p-4 pt-0 border-t border-border\">\n                    <ul className=\"space-y-2\">\n                      {latestReport.sources.map((s, i) => (\n                        <li key={i} className=\"text-sm break-all\">\n                          <a href={s} target=\"_blank\" rel=\"noreferrer\" className=\"text-primary hover:underline\">{s}</a>\n                        </li>\n                      ))}\n                    </ul>\n                  </CollapsibleContent>\n                </Collapsible>\n              </div>\n            )}\n          </div>\n\n          {/* Research audit trail */}\n          <div className=\"space-y-4\">\n            <h3 className=\"text-lg font-medium\">Research Audit Trail</h3>\n            <Card className=\"shadow-sm\">\n              <CardContent className=\"p-0\">\n                {runs.length === 0 ? (\n                  <div className=\"p-4 text-sm text-muted-foreground text-center\">No research runs logged.</div>\n                ) : (\n                  <div className=\"divide-y divide-border\">\n                    {runs.map(run => (\n                      <div key={run.id} className=\"p-4 flex items-center justify-between gap-4\">\n                        <div>\n                          <div className=\"font-medium text-sm capitalize\">{run.trigger} run</div>\n                          <div className=\"text-xs text-muted-foreground mt-0.5\">{formatDateTime(run.createdAt)}</div>\n                          {run.error && <div className=\"text-xs text-destructive mt-1\">{run.error}</div>}\n                        </div>\n                        <Badge variant=\"outline\" className={`capitalize ${run.status === \"complete\" ? \"bg-emerald-50 text-emerald-700\" : run.status === \"failed\" ? \"bg-destructive/10 text-destructive\" : \"\"}`}>\n                          {run.status}\n                        </Badge>\n                      </div>\n                    ))}\n                  </div>\n                )}\n              </CardContent>\n            </Card>\n          </div>\n        </TabsContent>\n\n        {/* \u2500\u2500 Requirements tab \u2500\u2500 */}\n        <TabsContent value=\"requirements\">\n          <ServiceRequirementsTab serviceId={id} serviceType={service.serviceType} />\n        </TabsContent>\n\n        {/* \u2500\u2500 Current deal tab \u2500\u2500 */}\n        <TabsContent value=\"deal\">\n          <CurrentDealTab serviceId={id} />\n        </TabsContent>\n      </Tabs>\n    </AppLayout>\n  );\n}\n\n\n============================================================\nFILE: artifacts/renewal-scout/src/pages/service-form.tsx\n============================================================\nimport { useEffect } from \"react\";\nimport { useLocation, useParams } from \"wouter\";\nimport { useForm } from \"react-hook-form\";\nimport { z } from \"zod\";\nimport { zodResolver } from \"@hookform/resolvers/zod\";\nimport { useQueryClient } from \"@tanstack/react-query\";\nimport { \n  useGetService, \n  useCreateService, \n  useUpdateService,\n  getListServicesQueryKey,\n  getGetServiceQueryKey\n} from \"@workspace/api-client-react\";\n\nimport { AppLayout } from \"@/components/layout\";\nimport { Button } from \"@/components/ui/button\";\nimport { Input } from \"@/components/ui/input\";\nimport { Textarea } from \"@/components/ui/textarea\";\nimport { Checkbox } from \"@/components/ui/checkbox\";\nimport { Card, CardContent, CardHeader, CardTitle, CardDescription } from \"@/components/ui/card\";\nimport { Label } from \"@/components/ui/label\";\nimport { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from \"@/components/ui/select\";\nimport { useToast } from \"@/hooks/use-toast\";\nimport { ChevronLeft, Info, Loader2, Save } from \"lucide-react\";\nimport { Form, FormControl, FormField, FormItem, FormLabel, FormMessage, FormDescription } from \"@/components/ui/form\";\n\nconst SERVICE_TYPES = [\n  \"Broadband\", \"Electricity\", \"Gas and electricity\", \"Car insurance\", \n  \"Home insurance\", \"Life insurance\", \"Credit card\", \"Loan\", \"Mobile phone\", \"Other\"\n];\n\nconst formSchema = z.object({\n  serviceType: z.string().min(1, \"Service type is required\"),\n  provider: z.string().min(1, \"Provider is required\").max(160),\n  productName: z.string().nullable().optional(),\n  monthlyCostGbp: z.coerce.number().nullable().optional(),\n  annualCostGbp: z.coerce.number().nullable().optional(),\n  renewalDate: z.string().nullable().optional(),\n  contractEndDate: z.string().nullable().optional(),\n  noticeDays: z.coerce.number().min(0).max(365).default(30),\n  researchWindowDays: z.coerce.number().min(1).max(365).default(60),\n  location: z.string().nullable().optional(),\n  currentTerms: z.string().nullable().optional(),\n  preferences: z.string().nullable().optional(),\n  quoteFacts: z.string().nullable().optional(),\n  autoResearch: z.boolean().default(false),\n});\n\ntype FormValues = z.infer<typeof formSchema>;\n\nexport default function ServiceFormPage() {\n  const params = useParams();\n  const isNew = !params.id || params.id === \"new\";\n  const id = isNew ? null : Number(params.id);\n  \n  const [_, setLocation] = useLocation();\n  const { toast } = useToast();\n  const queryClient = useQueryClient();\n\n  const { data: detail, isLoading: isFetching } = useGetService(id!, {\n    query: { enabled: !!id, queryKey: getGetServiceQueryKey(id!) }\n  });\n\n  const createService = useCreateService();\n  const updateService = useUpdateService();\n\n  const form = useForm<FormValues>({\n    resolver: zodResolver(formSchema),\n    defaultValues: {\n      serviceType: \"\",\n      provider: \"\",\n      productName: \"\",\n      monthlyCostGbp: null,\n      annualCostGbp: null,\n      renewalDate: \"\",\n      contractEndDate: \"\",\n      noticeDays: 30,\n      researchWindowDays: 60,\n      location: \"\",\n      currentTerms: \"\",\n      preferences: \"\",\n      quoteFacts: \"\",\n      autoResearch: false\n    }\n  });\n\n  useEffect(() => {\n    if (detail?.service && !isNew) {\n      const s = detail.service;\n      form.reset({\n        serviceType: s.serviceType,\n        provider: s.provider,\n        productName: s.productName || \"\",\n        monthlyCostGbp: s.monthlyCostGbp,\n        annualCostGbp: s.annualCostGbp,\n        renewalDate: s.renewalDate ? s.renewalDate.split('T')[0] : \"\",\n        contractEndDate: s.contractEndDate ? s.contractEndDate.split('T')[0] : \"\",\n        noticeDays: s.noticeDays,\n        researchWindowDays: s.researchWindowDays,\n        location: s.location || \"\",\n        currentTerms: s.currentTerms || \"\",\n        preferences: s.preferences || \"\",\n        quoteFacts: s.quoteFacts || \"\",\n        autoResearch: s.autoResearch,\n      });\n    }\n  }, [detail, isNew, form]);\n\n  const onSubmit = (values: FormValues) => {\n    // Transform empty strings to null for optional API fields\n    const payload = {\n      ...values,\n      productName: values.productName || null,\n      renewalDate: values.renewalDate || null,\n      contractEndDate: values.contractEndDate || null,\n      location: values.location || null,\n      currentTerms: values.currentTerms || null,\n      preferences: values.preferences || null,\n      quoteFacts: values.quoteFacts || null,\n    };\n\n    if (isNew) {\n      createService.mutate({ data: payload }, {\n        onSuccess: (res) => {\n          toast({ title: \"Service created\" });\n          queryClient.invalidateQueries({ queryKey: getListServicesQueryKey() });\n          setLocation(`/services/${res.id}`);\n        },\n        onError: (err) => {\n          toast({ title: \"Failed to create\", description: err.data?.error, variant: \"destructive\" });\n        }\n      });\n    } else {\n      updateService.mutate({ id: id!, data: payload }, {\n        onSuccess: () => {\n          toast({ title: \"Service updated\" });\n          queryClient.invalidateQueries({ queryKey: getListServicesQueryKey() });\n          queryClient.invalidateQueries({ queryKey: getGetServiceQueryKey(id!) });\n          setLocation(`/services/${id}`);\n        },\n        onError: (err) => {\n          toast({ title: \"Failed to update\", description: err.data?.error, variant: \"destructive\" });\n        }\n      });\n    }\n  };\n\n  if (!isNew && isFetching) {\n    return (\n      <AppLayout>\n        <div className=\"flex justify-center py-12\"><Loader2 className=\"h-6 w-6 animate-spin text-primary\" /></div>\n      </AppLayout>\n    );\n  }\n\n  const isPending = createService.isPending || updateService.isPending;\n\n  return (\n    <AppLayout>\n      <div className=\"mb-6\">\n        <Button variant=\"ghost\" size=\"sm\" onClick={() => setLocation(isNew ? \"/\" : `/services/${id}`)} className=\"gap-2 -ml-3 text-muted-foreground hover:text-foreground\">\n          <ChevronLeft className=\"h-4 w-4\" />\n          Back\n        </Button>\n      </div>\n      \n      <div className=\"mb-8\">\n        <h1 className=\"text-3xl font-bold tracking-tight text-foreground\">{isNew ? \"Add Service\" : \"Edit Service\"}</h1>\n        <p className=\"text-muted-foreground mt-1\">Track details and research preferences for this household service.</p>\n      </div>\n\n      <Form {...form}>\n        <form onSubmit={form.handleSubmit(onSubmit)} className=\"space-y-8 max-w-4xl pb-16\">\n          <Card className=\"shadow-sm\">\n            <CardHeader className=\"pb-4 border-b border-border/50\">\n              <CardTitle>Basic Information</CardTitle>\n            </CardHeader>\n            <CardContent className=\"pt-6 grid grid-cols-1 md:grid-cols-2 gap-6\">\n              <FormField\n                control={form.control}\n                name=\"serviceType\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Service Type</FormLabel>\n                    <Select onValueChange={field.onChange} defaultValue={field.value} value={field.value}>\n                      <FormControl>\n                        <SelectTrigger><SelectValue placeholder=\"Select type...\" /></SelectTrigger>\n                      </FormControl>\n                      <SelectContent>\n                        {SERVICE_TYPES.map(t => <SelectItem key={t} value={t}>{t}</SelectItem>)}\n                      </SelectContent>\n                    </Select>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"provider\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Current Provider</FormLabel>\n                    <FormControl><Input placeholder=\"e.g. BT, Octopus Energy\" {...field} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"productName\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Product/Tariff Name (Optional)</FormLabel>\n                    <FormControl><Input placeholder=\"e.g. Fibre 100\" {...field} value={field.value || \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n              <div className=\"hidden md:block\"></div>\n\n              <FormField\n                control={form.control}\n                name=\"monthlyCostGbp\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Monthly Cost (\u00a3)</FormLabel>\n                    <FormControl><Input type=\"number\" step=\"0.01\" {...field} value={field.value ?? \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"annualCostGbp\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Annual Cost (\u00a3) <span className=\"text-muted-foreground font-normal ml-1\">(Overrides monthly x 12)</span></FormLabel>\n                    <FormControl><Input type=\"number\" step=\"0.01\" {...field} value={field.value ?? \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n            </CardContent>\n          </Card>\n\n          <Card className=\"shadow-sm\">\n            <CardHeader className=\"pb-4 border-b border-border/50\">\n              <CardTitle>Dates & Timing</CardTitle>\n            </CardHeader>\n            <CardContent className=\"pt-6 grid grid-cols-1 md:grid-cols-2 gap-6\">\n              <FormField\n                control={form.control}\n                name=\"renewalDate\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Renewal Date</FormLabel>\n                    <FormControl><Input type=\"date\" {...field} value={field.value || \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"contractEndDate\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Contract End Date</FormLabel>\n                    <FormControl><Input type=\"date\" {...field} value={field.value || \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"noticeDays\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Notice Period (Days)</FormLabel>\n                    <FormControl><Input type=\"number\" {...field} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"researchWindowDays\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Start research N days before date</FormLabel>\n                    <FormControl><Input type=\"number\" {...field} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n            </CardContent>\n          </Card>\n\n          <Card className=\"shadow-sm\">\n            <CardHeader className=\"pb-4 border-b border-border/50\">\n              <CardTitle>Research Context</CardTitle>\n            </CardHeader>\n            <CardContent className=\"pt-6 space-y-6\">\n              <div className=\"bg-primary/5 border border-primary/10 rounded-md p-4 text-sm text-primary flex gap-3\">\n                <Info className=\"h-5 w-5 shrink-0\" />\n                <p>Use non-sensitive facts only. Do not enter passwords, full card details, bank details, or identity documents.</p>\n              </div>\n\n              <FormField\n                control={form.control}\n                name=\"location\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Location / Postcode District</FormLabel>\n                    <FormControl><Input placeholder=\"e.g. SW11 \u2014 avoid a full address\" {...field} value={field.value || \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"currentTerms\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Current Terms</FormLabel>\n                    <FormControl><Textarea className=\"min-h-[100px]\" placeholder=\"What are you getting now? e.g. 100Mbps download, free evening calls\" {...field} value={field.value || \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"preferences\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Preferences & Must-haves</FormLabel>\n                    <FormControl><Textarea className=\"min-h-[100px]\" placeholder=\"e.g. Must have 500+Mbps, prefer no setup fee, 12 month contract max\" {...field} value={field.value || \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n\n              <FormField\n                control={form.control}\n                name=\"quoteFacts\"\n                render={({ field }) => (\n                  <FormItem>\n                    <FormLabel>Non-sensitive Quote Facts</FormLabel>\n                    <FormControl><Textarea className=\"min-h-[100px]\" placeholder=\"e.g. 3 bedroom semi-detached house built in 1950, no previous claims\" {...field} value={field.value || \"\"} /></FormControl>\n                    <FormMessage />\n                  </FormItem>\n                )}\n              />\n              \n              <FormField\n                control={form.control}\n                name=\"autoResearch\"\n                render={({ field }) => (\n                  <FormItem className=\"flex flex-row items-start space-x-3 space-y-0 rounded-md border p-4 shadow-sm\">\n                    <FormControl>\n                      <Checkbox\n                        checked={field.value}\n                        onCheckedChange={field.onChange}\n                      />\n                    </FormControl>\n                    <div className=\"space-y-1 leading-none\">\n                      <FormLabel>Auto-research</FormLabel>\n                      <FormDescription>\n                        Automatically queue a research run when the target date is within the research window.\n                      </FormDescription>\n                    </div>\n                  </FormItem>\n                )}\n              />\n            </CardContent>\n          </Card>\n\n          <div className=\"flex justify-end gap-3\">\n            <Button type=\"button\" variant=\"outline\" onClick={() => setLocation(isNew ? \"/\" : `/services/${id}`)}>\n              Cancel\n            </Button>\n            <Button type=\"submit\" disabled={isPending} className=\"gap-2\">\n              {isPending ? <Loader2 className=\"h-4 w-4 animate-spin\" /> : <Save className=\"h-4 w-4\" />}\n              {isNew ? \"Create Service\" : \"Save Changes\"}\n            </Button>\n          </div>\n        </form>\n      </Form>\n    </AppLayout>\n  );\n}\n\n\n============================================================\nFILE: artifacts/renewal-scout/src/pages/service-requirements-tab.tsx\n============================================================\n/**\n * Service Requirements Tab \u2014 shown inside the service detail page.\n * Renders service-type-specific questions; saves to /api/services/:id/requirements.\n */\nimport { useState, useEffect } from \"react\";\nimport { useGetServiceRequirements, useUpdateServiceRequirements } from \"@workspace/api-client-react\";\nimport { Button } from \"@/components/ui/button\";\nimport { Input } from \"@/components/ui/input\";\nimport { Label } from \"@/components/ui/label\";\nimport { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from \"@/components/ui/select\";\nimport { Card, CardContent, CardHeader, CardTitle, CardDescription } from \"@/components/ui/card\";\nimport { useToast } from \"@/hooks/use-toast\";\nimport { Save, Loader2 } from \"lucide-react\";\n\n// \u2500\u2500\u2500 Question definitions per service type \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ntype FieldType = \"number\" | \"select\" | \"boolean\";\n\ninterface FieldDef {\n  key: string;\n  label: string;\n  hint?: string;\n  type: FieldType;\n  options?: { value: string; label: string }[];\n  min?: number;\n  max?: number;\n  placeholder?: string;\n}\n\nconst QUESTIONS: Record<string, FieldDef[]> = {\n  Broadband: [\n    { key: \"downloadSpeedMbps\", label: \"Minimum download speed (Mbps)\", type: \"number\", placeholder: \"e.g. 50\" },\n    { key: \"uploadSpeedMbps\", label: \"Minimum upload speed (Mbps)\", type: \"number\", placeholder: \"e.g. 10\" },\n    { key: \"contractLengthMonths\", label: \"Preferred contract length (months)\", type: \"select\",\n      options: [{ value: \"12\", label: \"12 months\" }, { value: \"18\", label: \"18 months\" }, { value: \"24\", label: \"24 months\" }, { value: \"any\", label: \"No preference\" }] },\n    { key: \"includesLineRental\", label: \"Must include line rental / landline?\", type: \"boolean\" },\n    { key: \"tvAddon\", label: \"Want a TV add-on?\", type: \"boolean\" },\n    { key: \"homePhoneAddon\", label: \"Want a home phone add-on?\", type: \"boolean\" },\n  ],\n  Electricity: [\n    { key: \"tariffType\", label: \"Tariff preference\", type: \"select\",\n      options: [{ value: \"fixed\", label: \"Fixed rate\" }, { value: \"variable\", label: \"Variable rate\" }, { value: \"any\", label: \"No preference\" }] },\n    { key: \"greenPreferred\", label: \"Prefer 100% renewable energy?\", type: \"boolean\" },\n    { key: \"smartMeter\", label: \"Do you have a smart meter?\", type: \"boolean\" },\n  ],\n  \"Gas and electricity\": [\n    { key: \"tariffType\", label: \"Tariff preference\", type: \"select\",\n      options: [{ value: \"fixed\", label: \"Fixed rate\" }, { value: \"variable\", label: \"Variable rate\" }, { value: \"any\", label: \"No preference\" }] },\n    { key: \"greenPreferred\", label: \"Prefer 100% renewable energy?\", type: \"boolean\" },\n    { key: \"smartMeter\", label: \"Do you have a smart meter?\", type: \"boolean\" },\n  ],\n  \"Car insurance\": [\n    { key: \"coverType\", label: \"Cover type\", type: \"select\",\n      options: [{ value: \"comprehensive\", label: \"Comprehensive\" }, { value: \"tpft\", label: \"Third party, fire & theft\" }, { value: \"tpo\", label: \"Third party only\" }] },\n    { key: \"namedDrivers\", label: \"Number of named drivers (including you)\", type: \"number\", placeholder: \"e.g. 1\", min: 1, max: 10 },\n    { key: \"parkingLocation\", label: \"Where is the car parked overnight?\", type: \"select\",\n      options: [{ value: \"garage\", label: \"Garage\" }, { value: \"driveway\", label: \"Driveway / off-road\" }, { value: \"street\", label: \"Street / public road\" }] },\n    { key: \"voluntaryExcessGbp\", label: \"Preferred voluntary excess (\u00a3)\", type: \"number\", placeholder: \"e.g. 250\" },\n    { key: \"useType\", label: \"Vehicle use\", type: \"select\",\n      options: [{ value: \"social\", label: \"Social, domestic & pleasure only\" }, { value: \"commuting\", label: \"Social + commuting\" }, { value: \"business\", label: \"Business use\" }] },\n  ],\n  \"Home insurance\": [\n    { key: \"coverType\", label: \"Cover needed\", type: \"select\",\n      options: [{ value: \"buildings_and_contents\", label: \"Buildings & contents\" }, { value: \"buildings_only\", label: \"Buildings only\" }, { value: \"contents_only\", label: \"Contents only\" }] },\n    { key: \"voluntaryExcessGbp\", label: \"Preferred voluntary excess (\u00a3)\", type: \"number\", placeholder: \"e.g. 250\" },\n    { key: \"highValueItems\", label: \"High-value items (jewellery, art, etc.) to specify?\", type: \"boolean\" },\n    { key: \"floodRisk\", label: \"Is the property in a flood risk area?\", type: \"boolean\" },\n  ],\n  \"Life insurance\": [\n    { key: \"coverType\", label: \"Cover type\", type: \"select\",\n      options: [{ value: \"level_term\", label: \"Level term\" }, { value: \"decreasing_term\", label: \"Decreasing term\" }, { value: \"whole_of_life\", label: \"Whole of life\" }] },\n    { key: \"termYears\", label: \"Cover term (years)\", type: \"number\", placeholder: \"e.g. 25\", min: 1, max: 50 },\n    { key: \"jointPolicy\", label: \"Joint policy?\", type: \"boolean\" },\n    { key: \"criticalIllnessCover\", label: \"Include critical illness cover?\", type: \"boolean\" },\n  ],\n  \"Credit card\": [\n    { key: \"primaryUse\", label: \"Primary use\", type: \"select\",\n      options: [{ value: \"purchases\", label: \"Everyday purchases\" }, { value: \"balance_transfer\", label: \"Balance transfer\" }, { value: \"travel\", label: \"Travel rewards\" }, { value: \"cashback\", label: \"Cashback\" }] },\n    { key: \"balanceTransfer\", label: \"Planning a balance transfer?\", type: \"boolean\" },\n  ],\n  Loan: [\n    { key: \"purposeOfLoan\", label: \"Loan purpose\", type: \"select\",\n      options: [{ value: \"home_improvement\", label: \"Home improvement\" }, { value: \"car\", label: \"Car\" }, { value: \"debt_consolidation\", label: \"Debt consolidation\" }, { value: \"other\", label: \"Other\" }] },\n    { key: \"amountGbp\", label: \"Loan amount (\u00a3)\", type: \"number\", placeholder: \"e.g. 10000\" },\n    { key: \"termMonths\", label: \"Preferred term (months)\", type: \"number\", placeholder: \"e.g. 36\" },\n  ],\n  \"Mobile phone\": [\n    { key: \"dataGb\", label: \"Minimum data per month (GB)\", type: \"number\", placeholder: \"e.g. 10\" },\n    { key: \"includesHandset\", label: \"Include new handset in the deal?\", type: \"boolean\" },\n    { key: \"contractMonths\", label: \"Contract length (months)\", type: \"select\",\n      options: [{ value: \"12\", label: \"12 months\" }, { value: \"24\", label: \"24 months\" }, { value: \"rolling\", label: \"Rolling (SIM-only)\" }] },\n    { key: \"roamingNeeded\", label: \"Regular EU/international roaming needed?\", type: \"boolean\" },\n  ],\n};\n\n// \u2500\u2500\u2500 Field input components \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nfunction BoolField({ value, onChange }: { value: boolean | null; onChange: (v: boolean | null) => void }) {\n  return (\n    <Select\n      value={value === null ? \"__unknown__\" : value ? \"yes\" : \"no\"}\n      onValueChange={(v) => onChange(v === \"__unknown__\" ? null : v === \"yes\")}\n    >\n      <SelectTrigger><SelectValue /></SelectTrigger>\n      <SelectContent>\n        <SelectItem value=\"__unknown__\">I don't know</SelectItem>\n        <SelectItem value=\"yes\">Yes</SelectItem>\n        <SelectItem value=\"no\">No</SelectItem>\n      </SelectContent>\n    </Select>\n  );\n}\n\n// \u2500\u2500\u2500 Main component \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nexport function ServiceRequirementsTab({\n  serviceId,\n  serviceType,\n}: {\n  serviceId: number;\n  serviceType: string;\n}) {\n  const { toast } = useToast();\n  const [localFields, setLocalFields] = useState<Record<string, unknown>>({});\n  const [dirty, setDirty] = useState(false);\n\n  const { data, isLoading } = useGetServiceRequirements(serviceId);\n  const save = useUpdateServiceRequirements();\n\n  const questions = QUESTIONS[serviceType] ?? [];\n\n  useEffect(() => {\n    if (data?.fields) {\n      setLocalFields(data.fields as Record<string, unknown>);\n    }\n  }, [data?.updatedAt]);\n\n  function setField(key: string, value: unknown) {\n    setDirty(true);\n    setLocalFields((f) => ({ ...f, [key]: value }));\n  }\n\n  function handleSave() {\n    save.mutate(\n      { id: serviceId, data: { fields: localFields } },\n      {\n        onSuccess: () => {\n          toast({ title: \"Requirements saved\" });\n          setDirty(false);\n        },\n        onError: (err) => {\n          toast({\n            title: \"Failed to save\",\n            description: (err as { data?: { error?: string } }).data?.error ?? \"Unknown error\",\n            variant: \"destructive\",\n          });\n        },\n      },\n    );\n  }\n\n  if (isLoading) {\n    return <div className=\"flex items-center gap-2 py-8 text-muted-foreground\"><Loader2 className=\"h-4 w-4 animate-spin\" /> Loading\u2026</div>;\n  }\n\n  if (questions.length === 0) {\n    return (\n      <Card>\n        <CardContent className=\"py-8 text-center text-muted-foreground text-sm\">\n          No service-specific requirements for <strong>{serviceType}</strong> yet.\n          General requirements can be entered in the service edit form.\n        </CardContent>\n      </Card>\n    );\n  }\n\n  return (\n    <div className=\"space-y-6\">\n      <Card>\n        <CardHeader>\n          <CardTitle>Service Requirements</CardTitle>\n          <CardDescription>\n            Tell the AI what you need from your {serviceType} deal. Leave anything you're not sure about blank.\n          </CardDescription>\n        </CardHeader>\n        <CardContent className=\"space-y-5\">\n          {questions.map((q) => {\n            const value = localFields[q.key] ?? null;\n            return (\n              <div key={q.key}>\n                <Label className=\"text-sm font-medium\">{q.label}</Label>\n                {q.hint && <p className=\"text-xs text-muted-foreground mt-0.5 mb-1\">{q.hint}</p>}\n                <div className=\"mt-1\">\n                  {q.type === \"boolean\" ? (\n                    <BoolField value={value as boolean | null} onChange={(v) => setField(q.key, v)} />\n                  ) : q.type === \"select\" ? (\n                    <Select\n                      value={(value as string | null) ?? \"__unknown__\"}\n                      onValueChange={(v) => setField(q.key, v === \"__unknown__\" ? null : v)}\n                    >\n                      <SelectTrigger><SelectValue placeholder=\"Select\u2026\" /></SelectTrigger>\n                      <SelectContent>\n                        <SelectItem value=\"__unknown__\">I don't know / no preference</SelectItem>\n                        {q.options?.map((o) => <SelectItem key={o.value} value={o.value}>{o.label}</SelectItem>)}\n                      </SelectContent>\n                    </Select>\n                  ) : (\n                    <Input\n                      type=\"number\"\n                      placeholder={q.placeholder ?? \"Leave blank if unknown\"}\n                      min={q.min}\n                      max={q.max}\n                      value={(value as number | null) ?? \"\"}\n                      onChange={(e) => setField(q.key, e.target.value === \"\" ? null : Number(e.target.value))}\n                    />\n                  )}\n                </div>\n              </div>\n
