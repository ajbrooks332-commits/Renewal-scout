nst serviceIds = [...new Set(runs.map((r) => r.serviceId))];\n  const services =\n    serviceIds.length > 0\n      ? await Promise.all(\n          serviceIds.map((id) =>\n            db\n              .select({\n                id: servicesTable.id,\n                provider: servicesTable.provider,\n                serviceType: servicesTable.serviceType,\n              })\n              .from(servicesTable)\n              .where(eq(servicesTable.id, id))\n              .limit(1)\n              .then((rows) => rows[0] ?? null)\n          )\n        )\n      : [];\n\n  const serviceMap = new Map(services.filter(Boolean).map((s) => [s!.id, s!]));\n\n  res.json(\n    runs.map((r) => {\n      const svc = serviceMap.get(r.serviceId);\n      return {\n        id: r.id,\n        serviceId: r.serviceId,\n        serviceName: svc?.provider ?? `Service #${r.serviceId}`,\n        serviceType: svc?.serviceType ?? \"Unknown\",\n        trigger: r.trigger,\n        status: r.status,\n        error: r.error ?? null,\n        createdAt: r.createdAt.toISOString(),\n        startedAt: r.startedAt?.toISOString() ?? null,\n        completedAt: r.completedAt?.toISOString() ?? null,\n      };\n    })\n  );\n});\n\n// POST /due-check\nrouter.post(\"/due-check\", async (_req, res): Promise<void> => {\n  const runIds = await scanDueServices();\n  res.status(202).json({\n    queued: runIds.length,\n    message:\n      runIds.length === 0\n        ? \"No services are due for research right now.\"\n        : `Queued research for ${runIds.length} service(s).`,\n  });\n});\n\nexport default router;\n\n\n============================================================\nFILE: artifacts/api-server/src/routes/service-requirements.ts\n============================================================\nimport { Router, type IRouter } from \"express\";\nimport { eq } from \"drizzle-orm\";\nimport { db, servicesTable, serviceRequirementsTable } from \"@workspace/db\";\nimport { requireAuth } from \"../middlewares/require-auth\";\n\nconst router: IRouter = Router();\nrouter.use(requireAuth);\n\nfunction parseId(raw: string | undefined): number | null {\n  const n = parseInt(raw ?? \"\", 10);\n  return isNaN(n) ? null : n;\n}\n\n// Known requirement field keys per service type \u2014 used for validation\nconst KNOWN_FIELDS: Record<string, string[]> = {\n  Broadband: [\n    \"downloadSpeedMbps\", \"uploadSpeedMbps\", \"contractLengthMonths\",\n    \"includesLineRental\", \"tvAddon\", \"homePhoneAddon\",\n  ],\n  Electricity: [\n    \"annualKwh\", \"tariffType\", \"greenPreferred\", \"smartMeter\",\n  ],\n  \"Gas and electricity\": [\n    \"annualElectricityKwh\", \"annualGasKwh\", \"tariffType\",\n    \"greenPreferred\", \"smartMeter\",\n  ],\n  \"Car insurance\": [\n    \"coverType\", \"namedDrivers\", \"parkingLocation\", \"modifiedVehicle\",\n    \"noClaimsYears\", \"useType\", \"voluntaryExcessGbp\",\n  ],\n  \"Home insurance\": [\n    \"coverType\", \"rebuildValueGbp\", \"contentsValueGbp\",\n    \"voluntaryExcessGbp\", \"prevClaims\", \"highValueItems\",\n    \"floodRisk\",\n  ],\n  \"Life insurance\": [\n    \"coverType\", \"coverAmountGbp\", \"termYears\", \"jointPolicy\",\n    \"criticalIllnessCover\",\n  ],\n  \"Credit card\": [\n    \"primaryUse\", \"creditLimitGbp\", \"rewardPreference\",\n    \"balanceTransfer\",\n  ],\n  Loan: [\n    \"purposeOfLoan\", \"amountGbp\", \"termMonths\",\n  ],\n  \"Mobile phone\": [\n    \"dataGb\", \"includesHandset\", \"networkPreference\", \"contractMonths\",\n    \"roamingNeeded\",\n  ],\n};\n\n// GET /services/:id/requirements\nrouter.get(\"/services/:id/requirements\", async (req, res): Promise<void> => {\n  const id = parseId(req.params[\"id\"]);\n  if (!id) { res.status(400).json({ error: \"Invalid id\" }); return; }\n\n  const [service] = await db\n    .select()\n    .from(servicesTable)\n    .where(eq(servicesTable.id, id));\n  if (!service) { res.status(404).json({ error: \"Service not found.\" }); return; }\n\n  const [req_row] = await db\n    .select()\n    .from(serviceRequirementsTable)\n    .where(eq(serviceRequirementsTable.serviceId, id));\n\n  if (!req_row) {\n    res.json({\n      serviceId: id,\n      schemaVersion: \"1\",\n      fields: {},\n      updatedAt: new Date().toISOString(),\n    });\n    return;\n  }\n\n  res.json({\n    serviceId: req_row.serviceId,\n    schemaVersion: req_row.schemaVersion,\n    fields: req_row.fields,\n    updatedAt: req_row.updatedAt.toISOString(),\n  });\n});\n\n// PUT /services/:id/requirements\nrouter.put(\"/services/:id/requirements\", async (req, res): Promise<void> => {\n  const id = parseId(req.params[\"id\"]);\n  if (!id) { res.status(400).json({ error: \"Invalid id\" }); return; }\n\n  const [service] = await db\n    .select()\n    .from(servicesTable)\n    .where(eq(servicesTable.id, id));\n  if (!service) { res.status(404).json({ error: \"Service not found.\" }); return; }\n\n  const body = req.body as { fields?: Record<string, unknown> };\n  if (!body.fields || typeof body.fields !== \"object\") {\n    res.status(400).json({ error: \"fields object is required.\" });\n    return;\n  }\n\n  // Filter to known fields for this service type (ignore unknown keys)\n  const allowed = KNOWN_FIELDS[service.serviceType] ?? [];\n  const filtered: Record<string, unknown> = {};\n  for (const key of allowed) {\n    if (key in body.fields) {\n      filtered[key] = body.fields[key]; // null = \"I don't know\"\n    }\n  }\n\n  const [existing] = await db\n    .select()\n    .from(serviceRequirementsTable)\n    .where(eq(serviceRequirementsTable.serviceId, id));\n\n  let row;\n  if (existing) {\n    [row] = await db\n      .update(serviceRequirementsTable)\n      .set({ fields: filtered, updatedAt: new Date() })\n      .where(eq(serviceRequirementsTable.serviceId, id))\n      .returning();\n  } else {\n    [row] = await db\n      .insert(serviceRequirementsTable)\n      .values({ serviceId: id, fields: filtered })\n      .returning();\n  }\n\n  res.json({\n    serviceId: row!.serviceId,\n    schemaVersion: row!.schemaVersion,\n    fields: row!.fields,\n    updatedAt: row!.updatedAt.toISOString(),\n  });\n});\n\nexport { KNOWN_FIELDS };\nexport default router;\n\n\n============================================================\nFILE: artifacts/api-server/src/routes/services.ts\n============================================================\nimport { Router, type IRouter } from \"express\";\nimport { eq, asc } from \"drizzle-orm\";\nimport { db, servicesTable } from \"@workspace/db\";\nimport {\n  CreateServiceBody,\n  UpdateServiceBody,\n  GetServiceParams,\n} from \"@workspace/api-zod\";\nimport { requireAuth } from \"../middlewares/require-auth\";\nimport {\n  queueResearch,\n  executeResearch,\n  toApiReport,\n  serviceToApi,\n} from \"../lib/research-service\";\nimport { daysUntilTarget } from \"../lib/renewal-logic\";\nimport { validateServiceInput, trimServiceInput } from \"../lib/validation\";\nimport { checkCompleteness } from \"../lib/completeness\";\n\nconst router: IRouter = Router();\n\nrouter.use(requireAuth);\n\nfunction parseId(raw: string | string[] | undefined): number | null {\n  const s = Array.isArray(raw) ? raw[0] : raw;\n  const n = parseInt(s ?? \"\", 10);\n  return isNaN(n) ? null : n;\n}\n\nfunction buildServiceValues(data: Record<string, unknown>) {\n  // Trim short text fields before storing\n  const trimmed = trimServiceInput(data);\n  return {\n    serviceType: (trimmed[\"serviceType\"] as string | undefined) ?? \"Other\",\n    provider: (trimmed[\"provider\"] as string) ?? \"\",\n    productName:\n      (trimmed[\"productName\"] as string | null | undefined) ?? null,\n    monthlyCostGbp:\n      (trimmed[\"monthlyCostGbp\"] as number | null | undefined) ?? null,\n    annualCostGbp:\n      (trimmed[\"annualCostGbp\"] as number | null | undefined) ?? null,\n    renewalDate:\n      (trimmed[\"renewalDate\"] as string | null | undefined) ?? null,\n    contractEndDate:\n      (trimmed[\"contractEndDate\"] as string | null | undefined) ?? null,\n    noticeDays: (trimmed[\"noticeDays\"] as number | undefined) ?? 30,\n    researchWindowDays:\n      (trimmed[\"researchWindowDays\"] as number | undefined) ?? 60,\n    location: (trimmed[\"location\"] as string | null | undefined) ?? null,\n    currentTerms:\n      (trimmed[\"currentTerms\"] as string | null | undefined) ?? null,\n    preferences:\n      (trimmed[\"preferences\"] as string | null | undefined) ?? null,\n    quoteFacts: (trimmed[\"quoteFacts\"] as string | null | undefined) ?? null,\n    autoResearch: (trimmed[\"autoResearch\"] as boolean | undefined) ?? true,\n  };\n}\n\n// GET /services\nrouter.get(\"/services\", async (_req, res): Promise<void> => {\n  const services = await db\n    .select()\n    .from(servicesTable)\n    .where(eq(servicesTable.active, true))\n    .orderBy(asc(servicesTable.renewalDate));\n\n  const sorted = services.sort((a, b) => {\n    const da = daysUntilTarget(a);\n    const db2 = daysUntilTarget(b);\n    if (da === null && db2 === null) return 0;\n    if (da === null) return 1;\n    if (db2 === null) return -1;\n    return da - db2;\n  });\n\n  res.json(sorted.map(serviceToApi));\n});\n\n// POST /services\nrouter.post(\"/services\", async (req, res): Promise<void> => {\n  const parsed = CreateServiceBody.safeParse(req.body);\n  if (!parsed.success) {\n    res.status(400).json({ error: parsed.error.message });\n    return;\n  }\n\n  const rawData = parsed.data as Record<string, unknown>;\n  const trimmed = trimServiceInput(rawData);\n\n  if (!trimmed[\"provider\"] || !(trimmed[\"provider\"] as string).trim()) {\n    res.status(400).json({ error: \"Provider is required.\" });\n    return;\n  }\n\n  const fieldErrors = validateServiceInput(trimmed);\n  if (fieldErrors.length > 0) {\n    res.status(400).json({ error: \"Validation failed.\", fields: fieldErrors });\n    return;\n  }\n\n  const values = buildServiceValues(rawData);\n  const [service] = await db\n    .insert(servicesTable)\n    .values(values)\n    .returning();\n  res.status(201).json(serviceToApi(service));\n});\n\n// GET /services/:id\nrouter.get(\"/services/:id\", async (req, res): Promise<void> => {\n  const id = parseId(req.params[\"id\"]);\n  if (!id) {\n    res.status(400).json({ error: \"Invalid id\" });\n    return;\n  }\n\n  const { researchRunsTable } = await import(\"@workspace/db\");\n  const { desc } = await import(\"drizzle-orm\");\n\n  const [service] = await db\n    .select()\n    .from(servicesTable)\n    .where(eq(servicesTable.id, id));\n  if (!service) {\n    res.status(404).json({ error: \"Service not found.\" });\n    return;\n  }\n\n  const runs = await db\n    .select()\n    .from(researchRunsTable)\n    .where(eq(researchRunsTable.serviceId, id))\n    .orderBy(desc(researchRunsTable.createdAt))\n    .limit(12);\n\n  const latestComplete = runs.find((r) => r.status === \"complete\") ?? null;\n  const latestReport = latestComplete\n    ? toApiReport(latestComplete.reportJson)\n    : null;\n\n  const runsForApi = runs.map((r) => ({\n    id: r.id,\n    serviceId: r.serviceId,\n    trigger: r.trigger,\n    status: r.status,\n    error: r.error ?? null,\n    report: r.status === \"complete\" ? toApiReport(r.reportJson) : null,\n    createdAt: r.createdAt.toISOString(),\n    startedAt: r.startedAt?.toISOString() ?? null,\n    completedAt: r.completedAt?.toISOString() ?? null,\n  }));\n\n  const completenessReport = await checkCompleteness(id);\n\n  res.json({\n    service: serviceToApi(service),\n    runs: runsForApi,\n    latestReport: latestReport ?? null,\n    completenessReport,\n  });\n});\n\n// PUT /services/:id\nrouter.put(\"/services/:id\", async (req, res): Promise<void> => {\n  const id = parseId(req.params[\"id\"]);\n  if (!id) {\n    res.status(400).json({ error: \"Invalid id\" });\n    return;\n  }\n\n  const parsed = UpdateServiceBody.safeParse(req.body);\n  if (!parsed.success) {\n    res.status(400).json({ error: parsed.error.message });\n    return;\n  }\n\n  const rawData = parsed.data as Record<string, unknown>;\n  const trimmed = trimServiceInput(rawData);\n\n  if (!trimmed[\"provider\"] || !(trimmed[\"provider\"] as string).trim()) {\n    res.status(400).json({ error: \"Provider is required.\" });\n    return;\n  }\n\n  const fieldErrors = validateServiceInput(trimmed);\n  if (fieldErrors.length > 0) {\n    res.status(400).json({ error: \"Validation failed.\", fields: fieldErrors });\n    return;\n  }\n\n  const values = buildServiceValues(rawData);\n  const [service] = await db\n    .update(servicesTable)\n    .set({ ...values, updatedAt: new Date() })\n    .where(eq(servicesTable.id, id))\n    .returning();\n  if (!service) {\n    res.status(404).json({ error: \"Service not found.\" });\n    return;\n  }\n  res.json(serviceToApi(service));\n});\n\n// POST /services/:id/archive\nrouter.post(\"/services/:id/archive\", async (req, res): Promise<void> => {\n  const id = parseId(req.params[\"id\"]);\n  if (!id) {\n    res.status(400).json({ error: \"Invalid id\" });\n    return;\n  }\n\n  const [service] = await db\n    .update(servicesTable)\n    .set({ active: false, updatedAt: new Date() })\n    .where(eq(servicesTable.id, id))\n    .returning();\n  if (!service) {\n    res.status(404).json({ error: \"Service not found.\" });\n    return;\n  }\n  res.json(serviceToApi(service));\n});\n\n// POST /services/:id/research\nrouter.post(\"/services/:id/research\", async (req, res): Promise<void> => {\n  const id = parseId(req.params[\"id\"]);\n  if (!id) {\n    res.status(400).json({ error: \"Invalid id\" });\n    return;\n  }\n\n  // Completeness gate \u2014 422 if blocking fields missing and forceWithMissing not set\n  const body = (req.body ?? {}) as { forceWithMissing?: boolean };\n  if (!body.forceWithMissing) {\n    const completeness = await checkCompleteness(id);\n    if (completeness.blocking) {\n      res.status(422).json({\n        error: \"Missing required fields. Provide the missing information or pass forceWithMissing: true to proceed anyway.\",\n        missing: completeness.required,\n        completenessReport: completeness,\n      });\n      return;\n    }\n  }\n\n  let runId: number;\n  try {\n    runId = await queueResearch(id, \"manual\");\n  } catch (err) {\n    res.status(404).json({ error: (err as Error).message });\n    return;\n  }\n\n  // Fire research in background\n  executeResearch(runId).catch((e) =>\n    req.log.error({ e }, \"Background research error\"),\n  );\n\n  const { researchRunsTable } = await import(\"@workspace/db\");\n  const [run] = await db\n    .select()\n    .from(researchRunsTable)\n    .where(eq(researchRunsTable.id, runId));\n\n  res.status(202).json({\n    id: run.id,\n    serviceId: run.serviceId,\n    trigger: run.trigger,\n    status: run.status,\n    error: run.error ?? null,\n    report: null,\n    createdAt: run.createdAt.toISOString(),\n    startedAt: run.startedAt?.toISOString() ?? null,\n    completedAt: run.completedAt?.toISOString() ?? null,\n  });\n});\n\nexport default router;\n\n\n============================================================\nFILE: artifacts/api-server/tests/app.test.ts\n============================================================\nimport { describe, it, expect, vi, beforeEach, afterAll } from \"vitest\";\nimport request from \"supertest\";\nimport app from \"../src/app\";\n\n// \u2500\u2500\u2500 Helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n/** Grab the Set-Cookie header array from a response */\nfunction getCookieHeader(res: request.Response): string[] {\n  const raw = res.headers[\"set-cookie\"];\n  if (!raw) return [];\n  return Array.isArray(raw) ? raw : [raw];\n}\n\n// \u2500\u2500\u2500 Auth guard \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"Auth guard\", () => {\n  it(\"returns 401 for unauthenticated protected routes\", async () => {\n    const res = await request(app)\n      .get(\"/api/services\")\n      .set(\"Origin\", \"http://localhost:3000\");\n    expect(res.status).toBe(401);\n  });\n\n  it(\"returns 401 for unauthenticated dashboard\", async () => {\n    const res = await request(app)\n      .get(\"/api/dashboard/stats\")\n      .set(\"Origin\", \"http://localhost:3000\");\n    expect(res.status).toBe(401);\n  });\n\n  it(\"GET /api/auth/me returns authenticated: false when not logged in\", async () => {\n    const res = await request(app).get(\"/api/auth/me\");\n    expect(res.status).toBe(200);\n    expect(res.body.authenticated).toBe(false);\n  });\n});\n\n// \u2500\u2500\u2500 Session cookie flags \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"Session cookie flags\", () => {\n  it(\"login sets httpOnly and sameSite=strict cookie flags\", async () => {\n    const res = await request(app)\n      .post(\"/api/auth/login\")\n      .set(\"Origin\", \"http://localhost:3000\")\n      .send({ password: process.env[\"ADMIN_PASSWORD\"] });\n\n    // May be 200 or 429 depending on run order \u2014 just check cookie flags if set\n    const cookies = getCookieHeader(res);\n    if (cookies.length > 0) {\n      const cookie = cookies[0].toLowerCase();\n      expect(cookie).toContain(\"httponly\");\n      expect(cookie).toContain(\"samesite=strict\");\n    }\n  });\n});\n\n// \u2500\u2500\u2500 CSRF / Origin protection \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"CSRF protection\", () => {\n  it(\"blocks POST with a cross-site Origin in production mode\", async () => {\n    const origEnv = process.env[\"NODE_ENV\"];\n    process.env[\"NODE_ENV\"] = \"production\";\n    process.env[\"APP_BASE_URL\"] = \"https://my-renewal-scout.example.com\";\n\n    const res = await request(app)\n      .post(\"/api/auth/login\")\n      .set(\"Origin\", \"https://evil-attacker.com\")\n      .send({ password: \"anything\" });\n\n    process.env[\"NODE_ENV\"] = origEnv;\n    delete process.env[\"APP_BASE_URL\"];\n\n    expect(res.status).toBe(403);\n    expect(res.body.error).toMatch(/cross-site/i);\n  });\n\n  it(\"allows POST from the correct origin in production mode\", async () => {\n    const origEnv = process.env[\"NODE_ENV\"];\n    process.env[\"NODE_ENV\"] = \"production\";\n    process.env[\"APP_BASE_URL\"] = \"https://my-renewal-scout.example.com\";\n\n    // The request origin matches APP_BASE_URL \u2014 should NOT be blocked by CSRF\n    // (may still get 401/429 from other middleware, but not 403)\n    const res = await request(app)\n      .post(\"/api/auth/login\")\n      .set(\"Origin\", \"https://my-renewal-scout.example.com\")\n      .send({ password: \"wrong-password\" });\n\n    process.env[\"NODE_ENV\"] = origEnv;\n    delete process.env[\"APP_BASE_URL\"];\n\n    expect(res.status).not.toBe(403);\n  });\n\n  it(\"allows GET requests without Origin (no CSRF check on reads)\", async () => {\n    const res = await request(app).get(\"/api/auth/me\");\n    expect(res.status).toBe(200);\n  });\n});\n\n// \u2500\u2500\u2500 Login rate limiting \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"Login rate limiting\", () => {\n  it(\"returns 429 after exceeding the rate limit\", async () => {\n    // Send 15 login attempts \u2014 well above the limit of 10.\n    // At some point during the loop we must see a 429.\n    let got429 = false;\n    for (let i = 0; i < 15; i++) {\n      const res = await request(app)\n        .post(\"/api/auth/login\")\n        .set(\"Origin\", \"http://localhost:3000\")\n        .send({ password: \"wrong\" });\n      if (res.status === 429) {\n        got429 = true;\n        break;\n      }\n    }\n    expect(got429).toBe(true);\n  }, 30_000);\n});\n\n// \u2500\u2500\u2500 Scheduler warning \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"Scheduler warning in /auth/me\", () => {\n  it(\"includes scheduler warning when SCHEDULER_ENABLED is not set\", async () => {\n    const prev = process.env[\"SCHEDULER_ENABLED\"];\n    delete process.env[\"SCHEDULER_ENABLED\"];\n\n    const res = await request(app).get(\"/api/auth/me\");\n\n    if (prev !== undefined) process.env[\"SCHEDULER_ENABLED\"] = prev;\n\n    expect(res.status).toBe(200);\n    expect(res.body.schedulerEnabled).toBe(false);\n    const warnings: string[] = res.body.setupWarnings ?? [];\n    expect(warnings.some((w) => /scheduler/i.test(w))).toBe(true);\n  });\n\n  it(\"reports schedulerEnabled: true when SCHEDULER_ENABLED=true\", async () => {\n    const prev = process.env[\"SCHEDULER_ENABLED\"];\n    process.env[\"SCHEDULER_ENABLED\"] = \"true\";\n\n    const res = await request(app).get(\"/api/auth/me\");\n\n    if (prev !== undefined) process.env[\"SCHEDULER_ENABLED\"] = prev;\n    else delete process.env[\"SCHEDULER_ENABLED\"];\n\n    expect(res.status).toBe(200);\n    expect(res.body.schedulerEnabled).toBe(true);\n  });\n});\n\n// \u2500\u2500\u2500 URL sanitisation (via research-service helpers) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"URL sanitisation integration\", () => {\n  it(\"sanitiseReport strips non-http URLs from sources and deduplicates\", async () => {\n    const { sanitiseReport } = await import(\"../src/lib/research-service\");\n    const report = {\n      service_type: \"Test\",\n      as_of_date: \"2026-08-10\",\n      scope_statement: \"s\",\n      current_deal_assessment: \"c\",\n      options: [],\n      recommended_next_step: \"r\",\n      estimated_annual_saving_gbp: null,\n      missing_information: [],\n      comparison_checklist: [],\n      application_pack: [],\n      warnings: [],\n      sources: [\n        \"https://good.com\",\n        \"javascript:alert(1)\",\n        \"https://good.com\",\n      ],\n    };\n    const result = sanitiseReport(report);\n    expect(result.sources).toEqual([\"https://good.com\"]);\n  });\n});\n\n// \u2500\u2500\u2500 Duplicate research prevention \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"Duplicate research prevention\", () => {\n  it(\"queueResearch returns existing run ID when a run is already active\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    const existingRunId = 42;\n\n    // Mock: select returns an existing queued run\n    vi.mocked(db.select).mockImplementationOnce(\n      () =>\n        ({\n          from: () => ({\n            where: () => ({\n              limit: () =>\n                Promise.resolve([\n                  { id: existingRunId, serviceId: 1, status: \"queued\" },\n                ]),\n            }),\n          }),\n        }) as ReturnType<typeof db.select>,\n    );\n\n    // Mock: first select for the service\n    vi.mocked(db.select).mockImplementationOnce(\n      () =>\n        ({\n          from: () => ({\n            where: () =>\n              Promise.resolve([\n                {\n                  id: 1,\n                  active: true,\n                  autoResearch: true,\n                  provider: \"Test\",\n                  serviceType: \"Broadband\",\n                },\n              ]),\n          }),\n        }) as ReturnType<typeof db.select>,\n    );\n\n    // This is a unit-level guard: the app-level idempotency is already tested\n    // by verifying queueResearch returns the existing ID without inserting.\n    // The DB mock ensures no insert is called.\n    expect(existingRunId).toBe(42); // structural guard\n  });\n});\n\n// \u2500\u2500\u2500 Stale job recovery & index initialisation \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"Stale job recovery\", () => {\n  it(\"recoverStaleJobs and ensureActiveRunIndex are exported functions\", async () => {\n    const mod = await import(\"../src/lib/stale-jobs\");\n    expect(typeof mod.recoverStaleJobs).toBe(\"function\");\n    expect(typeof mod.ensureActiveRunIndex).toBe(\"function\");\n  });\n\n  it(\"ensureActiveRunIndex throws when the DB query fails (fail-closed startup)\", async () => {\n    // If the DB pool can't create the partial unique index (e.g. due to\n    // pre-existing duplicate active rows or a DB outage), the error must\n    // propagate so the caller can abort startup rather than serve traffic\n    // without the deduplication constraint.\n    const { pool } = await import(\"@workspace/db\");\n    vi.mocked(pool.query).mockRejectedValueOnce(\n      new Error(\"relation already has duplicate rows\"),\n    );\n\n    const { ensureActiveRunIndex } = await import(\"../src/lib/stale-jobs\");\n    await expect(ensureActiveRunIndex()).rejects.toThrow(\n      \"relation already has duplicate rows\",\n    );\n  });\n});\n\n// \u2500\u2500\u2500 Safety boundary: no transaction routes exist \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"Safety boundary\", () => {\n  const transactionPaths = [\n    \"/api/payment\",\n    \"/api/apply\",\n    \"/api/cancel\",\n    \"/api/switch\",\n    \"/api/credit-search\",\n    \"/api/submit-application\",\n    \"/api/login-supplier\",\n  ];\n\n  for (const path of transactionPaths) {\n    it(`${path} is inaccessible (4xx \u2014 not authenticated or not found)`, async () => {\n      // These routes do not exist. Auth guard may fire before 404 (returning\n      // 401) for paths handled by the /api router. Either 401 or 404 confirms\n      // the route cannot be reached and no transaction was processed.\n      const res = await request(app)\n        .post(path)\n        .set(\"Origin\", \"http://localhost:3000\");\n      expect(res.status).toBeGreaterThanOrEqual(400);\n      expect(res.status).toBeLessThan(500);\n      // Critically, must NOT be a success response\n      expect(res.status).not.toBe(200);\n      expect(res.status).not.toBe(201);\n      expect(res.status).not.toBe(202);\n    });\n  }\n});\n\n\n============================================================\nFILE: artifacts/api-server/tests/schema.integration.test.ts\n============================================================\n/**\n * Schema integration test \u2014 runs against the real PostgreSQL database.\n *\n * This test does NOT use the vi.mock(\"@workspace/db\") shim from setup.ts.\n * It verifies that:\n *  1. runMigrations() completes without error (idempotent \u2014 called twice)\n *  2. All six expected tables exist in the public schema\n *  3. The four Task-5 tables have the correct key columns\n *  4. runMigrations() handles the \"upgrade from a push-provisioned database\"\n *     path correctly: when the drizzle migrations journal is cleared and\n *     the sentinel tables already exist, seeding recreates the journal and\n *     migrate() applies zero SQL statements (all tables remain intact).\n *\n * Run: pnpm --filter @workspace/api-server run test:integration\n *\n * DATABASE_URL must point at the real (or test) PostgreSQL instance.\n */\nimport { describe, it, expect, afterAll, beforeAll } from \"vitest\";\nimport { runMigrations, pool } from \"@workspace/db\";\n\nconst EXPECTED_TABLES = [\n  \"services\",\n  \"research_runs\",\n  \"household_profile\",\n  \"service_requirements\",\n  \"current_deals\",\n  \"document_extractions\",\n];\n\ndescribe(\"database schema \u2014 post-migration integrity\", () => {\n  it(\"runMigrations() completes without error (fresh call)\", async () => {\n    await expect(runMigrations()).resolves.not.toThrow();\n  });\n\n  it(\"runMigrations() is idempotent \u2014 safe to call twice\", async () => {\n    // A second call must also succeed without error and must not corrupt data.\n    await expect(runMigrations()).resolves.not.toThrow();\n  });\n\n  it(\"all six expected tables exist in the public schema\", async () => {\n    const { rows } = await pool.query<{ table_name: string }>(\n      `SELECT table_name\n       FROM information_schema.tables\n       WHERE table_schema = 'public'\n         AND table_type  = 'BASE TABLE'`,\n    );\n    const names = rows.map((r) => r.table_name);\n    for (const t of EXPECTED_TABLES) {\n      expect(names, `table \"${t}\" is missing`).toContain(t);\n    }\n  });\n\n  it(\"household_profile has questionnaire_version and car_make columns\", async () => {\n    const { rows } = await pool.query<{ column_name: string }>(\n      `SELECT column_name\n       FROM information_schema.columns\n       WHERE table_schema = 'public'\n         AND table_name   = 'household_profile'`,\n    );\n    const cols = rows.map((r) => r.column_name);\n    expect(cols).toContain(\"questionnaire_version\");\n    expect(cols).toContain(\"car_make\");\n    expect(cols).toContain(\"car_model\");\n    expect(cols).toContain(\"car_year\");\n  });\n\n  it(\"current_deals.fields has default empty jsonb and unique(service_id)\", async () => {\n    const { rows: colRows } = await pool.query<{\n      column_name: string;\n      column_default: string;\n    }>(\n      `SELECT column_name, column_default\n       FROM information_schema.columns\n       WHERE table_schema = 'public'\n         AND table_name   = 'current_deals'\n         AND column_name  = 'fields'`,\n    );\n    expect(colRows).toHaveLength(1);\n    expect(colRows[0]!.column_default).toMatch(/\\{\\}/); // default '{}'::jsonb\n\n    const { rows: idxRows } = await pool.query<{ constraint_type: string }>(\n      `SELECT constraint_type\n       FROM information_schema.table_constraints\n       WHERE table_schema    = 'public'\n         AND table_name      = 'current_deals'\n         AND constraint_type = 'UNIQUE'`,\n    );\n    expect(idxRows.length).toBeGreaterThan(0);\n  });\n\n  it(\"document_extractions has draft_field_keys (jsonb) and extraction_id (unique)\", async () => {\n    const { rows } = await pool.query<{\n      column_name: string;\n      data_type: string;\n    }>(\n      `SELECT column_name, data_type\n       FROM information_schema.columns\n       WHERE table_schema = 'public'\n         AND table_name   = 'document_extractions'`,\n    );\n    const byName = Object.fromEntries(rows.map((r) => [r.column_name, r.data_type]));\n    expect(byName[\"draft_field_keys\"]).toBe(\"jsonb\");\n    expect(byName[\"extraction_id\"]).toBeDefined();\n\n    const { rows: uq } = await pool.query<{ constraint_type: string }>(\n      `SELECT constraint_type\n       FROM information_schema.table_constraints\n       WHERE table_schema    = 'public'\n         AND table_name      = 'document_extractions'\n         AND constraint_type = 'UNIQUE'`,\n    );\n    expect(uq.length).toBeGreaterThan(0);\n  });\n});\n\n// \u2500\u2500 Upgrade-path test \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n//\n// Simulates a database that was provisioned via `drizzle-kit push`:\n//  - All tables already exist (services, research_runs, task-5 tables)\n//  - drizzle.__drizzle_migrations journal is EMPTY\n//\n// Verifies that runMigrations() correctly seeds the journal, applies zero SQL\n// DDL statements, and leaves all tables intact.\n\ndescribe(\"upgrade-path: push-provisioned database simulation\", () => {\n  // Save existing journal rows so we can restore them after the test.\n  let savedJournalRows: Array<{ hash: string; created_at: string | null }> = [];\n\n  beforeAll(async () => {\n    const { rows } = await pool.query<{ hash: string; created_at: string | null }>(\n      `SELECT hash, created_at FROM drizzle.__drizzle_migrations ORDER BY id`,\n    );\n    savedJournalRows = rows;\n    // Clear the journal \u2014 simulate a push-provisioned state\n    await pool.query(`DELETE FROM drizzle.__drizzle_migrations`);\n  });\n\n  afterAll(async () => {\n    // Restore original journal so subsequent test runs start from a known state.\n    await pool.query(`DELETE FROM drizzle.__drizzle_migrations`);\n    for (const row of savedJournalRows) {\n      await pool.query(\n        `INSERT INTO drizzle.__drizzle_migrations (hash, created_at) VALUES ($1, $2)`,\n        [row.hash, row.created_at],\n      );\n    }\n    await pool.end();\n  });\n\n  it(\"runMigrations() succeeds when journal is empty but all tables already exist\", async () => {\n    // No journal entries \u2192 seeding logic should detect sentinel tables and\n    // seed hashes, then migrate() runs zero DDL statements.\n    await expect(runMigrations()).resolves.not.toThrow();\n  });\n\n  it(\"all six tables still exist after journal-seeded migration run\", async () => {\n    const { rows } = await pool.query<{ table_name: string }>(\n      `SELECT table_name\n       FROM information_schema.tables\n       WHERE table_schema = 'public'\n         AND table_type   = 'BASE TABLE'`,\n    );\n    const names = rows.map((r) => r.table_name);\n    for (const t of EXPECTED_TABLES) {\n      expect(names, `table \"${t}\" was lost after seeded migration run`).toContain(t);\n    }\n  });\n\n  it(\"journal is re-populated after seeded migration run\", async () => {\n    const { rows } = await pool.query<{ count: string }>(\n      `SELECT COUNT(*)::text AS count FROM drizzle.__drizzle_migrations`,\n    );\n    // At minimum, both migrations should now be tracked\n    expect(parseInt(rows[0]!.count)).toBeGreaterThanOrEqual(2);\n  });\n\n  it(\"a second call to runMigrations() is still idempotent\", async () => {\n    await expect(runMigrations()).resolves.not.toThrow();\n  });\n});\n\n\n============================================================\nFILE: artifacts/api-server/tests/setup.ts\n============================================================\nimport { vi } from \"vitest\";\n\n// \u2500\u2500\u2500 Mock @workspace/db \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Must be defined before any module that imports it is loaded.\n//\n// We use importOriginal so that real table definitions (servicesTable,\n// currentDealsTable, etc.) are kept intact. Drizzle's `eq()` and other SQL\n// helpers require real column objects \u2014 mocking the tables as `{}` causes\n// runtime errors when routes call eq(someTable.id, value).\n// We only replace `db` and `pool` with vi.fn() mocks.\n\nvi.mock(\"@workspace/db\", async (importOriginal) => {\n  const actual = await importOriginal<typeof import(\"@workspace/db\")>();\n\n  /**\n   * Build a chainable query builder mock that resolves to `finalValue` when\n   * awaited. Every builder method (from, where, orderBy, set, values,\n   * onConflictDoNothing) returns the same chain so callers can chain\n   * .from().where().orderBy().limit() etc. freely.\n   */\n  const makeChain = (finalValue: unknown = []) => {\n    const resolved = Promise.resolve(finalValue);\n    const chain: Record<string, unknown> = {\n      // Return self for every builder method\n      from: () => chain,\n      where: () => chain,\n      orderBy: () => chain,\n      set: () => chain,\n      values: () => chain,\n      onConflictDoNothing: () => chain,\n      // Terminal methods that return a real Promise\n      limit: () => resolved,\n      returning: () => resolved,\n      // Make the chain itself awaitable \u2014 resolves to finalValue\n      then: (\n        onfulfilled?: ((value: unknown) => unknown) | null,\n        onrejected?: ((reason: unknown) => unknown) | null,\n      ) => resolved.then(onfulfilled, onrejected),\n      catch: (onrejected?: ((reason: unknown) => unknown) | null) =>\n        resolved.catch(onrejected),\n      finally: (onfinally?: (() => void) | null) => resolved.finally(onfinally),\n    };\n    return chain as ReturnType<typeof import(\"@workspace/db\").db.select>;\n  };\n\n  return {\n    // Keep real table definitions so Drizzle helpers (eq, etc.) work correctly\n    ...actual,\n    // Replace pool and db with mocks\n    pool: {\n      query: vi.fn().mockResolvedValue({ rows: [] }),\n      connect: vi.fn(),\n    },\n    db: {\n      select: vi.fn(() => makeChain([])),\n      update: vi.fn(() => makeChain([])),\n      insert: vi.fn(() => makeChain([])),\n    },\n  };\n});\n\n// \u2500\u2500\u2500 Set test environment \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nprocess.env[\"NODE_ENV\"] = \"test\";\nprocess.env[\"SESSION_SECRET\"] = \"test-secret-that-is-long-enough-for-tests\";\nprocess.env[\"ADMIN_PASSWORD\"] = \"test-admin-password\";\nprocess.env[\"DATABASE_URL\"] = \"postgresql://test:test@localhost/test\";\n\n\n============================================================\nFILE: artifacts/api-server/tests/task5.test.ts\n============================================================\n/**\n * Tests for Task #5 \u2014 Household profile, service requirements, current deals,\n * document extraction, and completeness gate.\n *\n * The DB mock is provided globally by tests/setup.ts (vi.mock(\"@workspace/db\")).\n * Tests override specific calls with mockReturnValueOnce(makeChain(...)) so\n * every chain level is awaitable (routes may await at .where(), .from(), etc.).\n *\n * Key constraints:\n *  - Single beforeAll login avoids the 10-per-15-min rate limiter.\n *  - beforeEach(vi.clearAllMocks) flushes the mockReturnValueOnce queue so\n *    unconsumed values from one test don't corrupt the next.\n *    vi.clearAllMocks does NOT reset the vi.fn() default implementations\n *    set in setup.ts (select \u2192 makeChain([]), etc.).\n */\nimport { describe, it, expect, vi, beforeAll, beforeEach } from \"vitest\";\nimport request from \"supertest\";\nimport app from \"../src/app\";\n\nvi.mock(\"openai\");\nvi.mock(\"file-type\");\nvi.mock(\"nodemailer\");\n\n// \u2500\u2500\u2500 Shared session \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Log in once per file to avoid hitting the rate limiter (max 10 per 15 min).\n\nlet authCookie = \"\";\n\nbeforeAll(async () => {\n  const res = await request(app)\n    .post(\"/api/auth/login\")\n    .send({ password: process.env[\"ADMIN_PASSWORD\"] });\n  const raw = res.headers[\"set-cookie\"] as string | string[] | undefined;\n  authCookie = Array.isArray(raw) ? raw[0]! : (raw ?? \"\");\n});\n\n// Flush mockReturnValueOnce queues between tests to prevent bleed-through.\n// vi.clearAllMocks() does NOT clear the queue; vi.resetAllMocks() does but\n// also wipes default implementations, so we re-apply them afterwards.\nbeforeEach(async () => {\n  vi.resetAllMocks();\n  const { db } = await import(\"@workspace/db\");\n  vi.mocked(db.select).mockImplementation(() => makeChain([]));\n  vi.mocked(db.insert).mockImplementation(() => makeChain([]));\n  vi.mocked(db.update).mockImplementation(() => makeChain([]));\n});\n\n// \u2500\u2500\u2500 Mock chain builder \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Routes often await `.where()` directly (no terminal `.limit()`), so every\n// node in the chain must be a thenable.  This mirrors the makeChain in\n// setup.ts but is local so tests can import it without circular issues.\n\n// eslint-disable-next-line @typescript-eslint/no-explicit-any\nfunction makeChain<T>(resolveWith: T): any {\n  const resolved = Promise.resolve(resolveWith);\n  const chain: Record<string, unknown> = {\n    from: () => chain,\n    where: () => chain,\n    orderBy: () => chain,\n    set: () => chain,\n    values: () => chain,\n    onConflictDoNothing: () => chain,\n    limit: () => resolved,\n    returning: () => resolved,\n    // eslint-disable-next-line @typescript-eslint/no-explicit-any\n    then: (f?: (v: T) => any, r?: (e: unknown) => any) => resolved.then(f, r),\n    catch: (r?: (e: unknown) => unknown) => resolved.catch(r),\n    finally: (f?: () => void) => resolved.finally(f),\n  };\n  return chain;\n}\n\n// \u2500\u2500\u2500 Household profile \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"GET /api/household-profile\", () => {\n  it(\"returns 401 without auth\", async () => {\n    const res = await request(app).get(\"/api/household-profile\");\n    expect(res.status).toBe(401);\n  });\n\n  it(\"returns a profile shape when none exists yet\", async () => {\n    // Default mock returns [] \u2014 simulates no profile row\n    const res = await request(app)\n      .get(\"/api/household-profile\")\n      .set(\"Cookie\", authCookie);\n    expect(res.status).toBe(200);\n    expect(res.body).toHaveProperty(\"questionnaireVersion\");\n  });\n});\n\n// \u2500\u2500\u2500 Service requirements \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"PUT /api/services/:id/requirements\", () => {\n  it(\"returns 401 without auth\", async () => {\n    const res = await request(app)\n      .put(\"/api/services/1/requirements\")\n      .send({ fields: {} });\n    expect(res.status).toBe(401);\n  });\n\n  it(\"returns 404 when service does not exist\", async () => {\n    // Default makeChain([]) \u2192 service not found\n    const res = await request(app)\n      .put(\"/api/services/9999/requirements\")\n      .set(\"Cookie\", authCookie)\n      .send({ fields: { downloadSpeedMbps: 100 } });\n    expect(res.status).toBe(404);\n  });\n\n  it(\"returns 400 when fields property is missing\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    vi.mocked(db.select).mockReturnValueOnce(\n      makeChain([{ id: 1, serviceType: \"Broadband\" }])\n    );\n\n    const res = await request(app)\n      .put(\"/api/services/1/requirements\")\n      .set(\"Cookie\", authCookie)\n      .send({ notFields: \"oops\" });\n    expect(res.status).toBe(400);\n  });\n});\n\n// \u2500\u2500\u2500 Current deals \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"GET /api/services/:id/current-deal\", () => {\n  it(\"returns 401 without auth\", async () => {\n    const res = await request(app).get(\"/api/services/1/current-deal\");\n    expect(res.status).toBe(401);\n  });\n\n  it(\"returns serviceId and empty fields when no deal saved yet\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    // Route calls: (1) service lookup, (2) getOrCreateDeal\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([{ id: 1, serviceType: \"Broadband\", provider: \"BT\" }]))\n      .mockReturnValueOnce(makeChain([])); // no deal\n\n    const res = await request(app)\n      .get(\"/api/services/1/current-deal\")\n      .set(\"Cookie\", authCookie);\n    expect(res.status).toBe(200);\n    expect(res.body.serviceId).toBe(1);\n    expect(res.body.fields).toEqual({});\n  });\n});\n\ndescribe(\"PUT /api/services/:id/current-deal\", () => {\n  it(\"rejects invalid provenance source\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    vi.mocked(db.select).mockReturnValueOnce(\n      makeChain([{ id: 1, serviceType: \"Broadband\" }])\n    );\n\n    const res = await request(app)\n      .put(\"/api/services/1/current-deal\")\n      .set(\"Cookie\", authCookie)\n      .send({ fields: { provider: { value: \"BT\", source: \"hacked\" } } });\n    expect(res.status).toBe(400);\n  });\n\n  it(\"accepts all four valid provenance sources\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    // Route calls: (1) service, (2) getOrCreateDeal \u2192 returns [], (3) insert\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([{ id: 1, serviceType: \"Broadband\" }]))\n      .mockReturnValueOnce(makeChain([])); // no existing deal\n    vi.mocked(db.insert).mockReturnValueOnce(\n      makeChain([{\n        serviceId: 1,\n        fields: { provider: { value: \"BT\", source: \"user\" } },\n        lastConfirmedAt: null,\n        updatedAt: new Date(),\n      }])\n    );\n\n    const res = await request(app)\n      .put(\"/api/services/1/current-deal\")\n      .set(\"Cookie\", authCookie)\n      .send({ fields: { provider: { value: \"BT\", source: \"user\" } } });\n    expect(res.status).toBe(200);\n    expect(res.body.serviceId).toBe(1);\n  });\n});\n\n// \u2500\u2500\u2500 Document extraction \u2014 MIME and size validation \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"POST /api/services/:id/extract-document\", () => {\n  it(\"returns 401 without auth\", async () => {\n    const res = await request(app)\n      .post(\"/api/services/1/extract-document\")\n      .attach(\"document\", Buffer.from(\"fake\"), \"doc.pdf\");\n    expect(res.status).toBe(401);\n  });\n\n  it(\"returns 400 when no file is uploaded\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    vi.mocked(db.select).mockReturnValueOnce(\n      makeChain([{ id: 1, serviceType: \"Broadband\" }])\n    );\n\n    const res = await request(app)\n      .post(\"/api/services/1/extract-document\")\n      .set(\"Cookie\", authCookie);\n    expect(res.status).toBe(400);\n    expect(res.body.error).toMatch(/No document/i);\n  });\n\n  it(\"returns 415 for unsupported MIME type (GIF)\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    vi.mocked(db.select).mockReturnValueOnce(\n      makeChain([{ id: 1, serviceType: \"Broadband\" }])\n    );\n    const { fileTypeFromBuffer } = await import(\"file-type\");\n    vi.mocked(fileTypeFromBuffer).mockResolvedValueOnce(\n      { mime: \"image/gif\", ext: \"gif\" } as Awaited<\n        ReturnType<typeof fileTypeFromBuffer>\n      >\n    );\n\n    const res = await request(app)\n      .post(\"/api/services/1/extract-document\")\n      .set(\"Cookie\", authCookie)\n      .attach(\"document\", Buffer.from(\"fake-gif-content\"), {\n        filename: \"image.gif\",\n        contentType: \"image/gif\",\n      });\n    expect(res.status).toBe(415);\n    expect(res.body.error).toMatch(/Unsupported/i);\n  });\n\n  it(\"returns 413 for files over 10 MB\", async () => {\n    const bigBuffer = Buffer.alloc(11 * 1024 * 1024, \"x\");\n    const res = await request(app)\n      .post(\"/api/services/1/extract-document\")\n      .set(\"Cookie\", authCookie)\n      .attach(\"document\", bigBuffer, {\n        filename: \"big.pdf\",\n        contentType: \"application/pdf\",\n      });\n    expect(res.status).toBe(413);\n  });\n});\n\n// \u2500\u2500\u2500 Completeness gate \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"completeness gate \u2014 POST /api/services/:id/research\", () => {\n  it(\"returns 401 without auth\", async () => {\n    const res = await request(app).post(\"/api/services/1/research\").send({});\n    expect(res.status).toBe(401);\n  });\n\n  it(\"returns 422 for car insurance with no household data (blocking)\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    const mockService = {\n      id: 1, serviceType: \"Car insurance\", provider: \"Admiral\", active: true,\n      autoResearch: true, renewalDate: null, contractEndDate: null,\n      noticeDays: 30, researchWindowDays: 60,\n    };\n\n    // research route: (1) service\n    // checkCompleteness: (2) service, (3) profile, (4) requirements, (5) deal\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([mockService])) // research route service\n      .mockReturnValueOnce(makeChain([mockService])) // checkCompleteness service\n      .mockReturnValueOnce(makeChain([]))            // profile (empty)\n      .mockReturnValueOnce(makeChain([]))            // requirements\n      .mockReturnValueOnce(makeChain([]));           // deal\n\n    const res = await request(app)\n      .post(\"/api/services/1/research\")\n      .set(\"Cookie\", authCookie)\n      .send({});\n\n    expect(res.status).toBe(422);\n    expect(res.body).toHaveProperty(\"completenessReport\");\n    expect(res.body.completenessReport.blocking).toBe(true);\n    expect(res.body.completenessReport.required.length).toBeGreaterThan(0);\n  });\n\n  it(\"bypasses the completeness gate when forceWithMissing is true\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    const mockService = {\n      id: 1, serviceType: \"Car insurance\", provider: \"Admiral\", active: true,\n      autoResearch: true, renewalDate: null, contractEndDate: null,\n      noticeDays: 30, researchWindowDays: 60,\n    };\n    const mockRun = {\n      id: 99, serviceId: 1, trigger: \"manual\", status: \"queued\",\n      error: null, reportJson: null, createdAt: new Date(),\n      startedAt: null, completedAt: null,\n    };\n\n    // research route: (1) service\n    // checkCompleteness: (2) service, (3) profile, (4) requirements, (5) deal\n    // insert run: via db.insert\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([mockService])) // research route service\n      .mockReturnValueOnce(makeChain([mockService])) // checkCompleteness service\n      .mockReturnValueOnce(makeChain([]))            // profile (empty)\n      .mockReturnValueOnce(makeChain([]))            // requirements\n      .mockReturnValueOnce(makeChain([]));           // deal\n    vi.mocked(db.insert).mockReturnValueOnce(makeChain([mockRun]));\n\n    const res = await request(app)\n      .post(\"/api/services/1/research\")\n      .set(\"Cookie\", authCookie)\n      .send({ forceWithMissing: true });\n\n    expect(res.status).not.toBe(422);\n  });\n});\n\n// \u2500\u2500\u2500 Extraction confirmation \u2014 key integrity and merge semantics \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"extraction confirmation \u2014 merge semantics and key validation\", () => {\n  const mockService = { id: 1, serviceType: \"Broadband\", provider: \"BT\" };\n  const mockExtraction = {\n    id: 10,\n    serviceId: 1,\n    extractionId: \"test-uuid-abc\",\n    fieldCount: 2,\n    confirmedCount: 0,\n    draftFieldKeys: [\"monthlyCostGbp\", \"tariffName\"],\n    extractedAt: new Date(),\n    deletedAt: null,\n  };\n\n  it(\"rejects confirmedFields keys not in the extraction draft\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    // route: (1) service, (2) extraction\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([mockService]))\n      .mockReturnValueOnce(makeChain([mockExtraction]));\n\n    const res = await request(app)\n      .put(\"/api/services/1/extraction-draft/test-uuid-abc/confirm\")\n      .set(\"Cookie\", authCookie)\n      .send({\n        // \"provider\" is NOT a draft key \u2014 only monthlyCostGbp and tariffName are\n        confirmedFields: { provider: { value: \"Injected\", source: \"extracted_confirmed\" } },\n        deletedFields: [],\n      });\n    expect(res.status).toBe(400);\n    expect(res.body.error).toMatch(/provider/);\n    expect(res.body.error).toMatch(/not in this extraction draft/i);\n  });\n\n  it(\"rejects deletedFields keys not in the extraction draft\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    // route: (1) service, (2) extraction\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([mockService]))\n      .mockReturnValueOnce(makeChain([mockExtraction]));\n\n    const res = await request(app)\n      .put(\"/api/services/1/extraction-draft/test-uuid-abc/confirm\")\n      .set(\"Cookie\", authCookie)\n      .send({\n        confirmedFields: {},\n        deletedFields: [\"provider\"], // not in this draft\n      });\n    expect(res.status).toBe(400);\n    expect(res.body.error).toMatch(/provider/);\n    expect(res.body.error).toMatch(/not in this extraction draft/i);\n  });\n\n  it(\"deleting a draft field preserves a pre-existing user-entered value for that key\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    const existingUserField = {\n      monthlyCostGbp: { value: 39.99, source: \"user\" },\n      provider: { value: \"BT\", source: \"user\" },\n    };\n\n    // route: (1) service, (2) extraction, (3) getOrCreateDeal\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([mockService]))\n      .mockReturnValueOnce(makeChain([mockExtraction]))\n      .mockReturnValueOnce(makeChain([{\n        serviceId: 1, fields: existingUserField, lastConfirmedAt: null, updatedAt: new Date(),\n      }]));\n\n    let savedFields: unknown = null;\n    vi.mocked(db.update)\n      .mockReturnValueOnce({\n        // Capture .set() argument so we can assert on the merged fields\n        set: vi.fn().mockImplementation((vals: { fields: unknown }) => {\n          savedFields = vals.fields;\n          return makeChain([{\n            serviceId: 1, fields: vals.fields, lastConfirmedAt: new Date(), updatedAt: new Date(),\n          }]);\n        }),\n      } as never)\n      .mockReturnValueOnce(makeChain([])); // confirmedCount update on extractions table\n\n    const res = await request(app)\n      .put(\"/api/services/1/extraction-draft/test-uuid-abc/confirm\")\n      .set(\"Cookie\", authCookie)\n      .send({\n        confirmedFields: {},\n        // User rejects extracted monthlyCostGbp \u2014 existing user-entered value must survive\n        deletedFields: [\"monthlyCostGbp\"],\n      });\n\n    expect(res.status).toBe(200);\n    expect(savedFields).not.toBeNull();\n    const saved = savedFields as Record<string, { value: unknown; source: string }>;\n    // Existing user-entered value is preserved \u2014 deletion only discards the draft\n    expect(saved[\"monthlyCostGbp\"]).toBeDefined();\n    expect(saved[\"monthlyCostGbp\"]!.source).toBe(\"user\");\n    expect(saved[\"monthlyCostGbp\"]!.value).toBe(39.99);\n    // provider was not in the draft and remains untouched\n    expect(saved[\"provider\"]!.source).toBe(\"user\");\n  });\n\n  it(\"confirming a draft field replaces a pre-existing user-entered value (explicit approval)\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    const existingUserField = { monthlyCostGbp: { value: 39.99, source: \"user\" } };\n\n    // route: (1) service, (2) extraction, (3) getOrCreateDeal\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([mockService]))\n      .mockReturnValueOnce(makeChain([mockExtraction]))\n      .mockReturnValueOnce(makeChain([{\n        serviceId: 1, fields: existingUserField, lastConfirmedAt: null, updatedAt: new Date(),\n      }]));\n\n    let savedFields: unknown = null;\n    vi.mocked(db.update)\n      .mockReturnValueOnce({\n        set: vi.fn().mockImplementation((vals: { fields: unknown }) => {\n          savedFields = vals.fields;\n          return makeChain([{\n            serviceId: 1, fields: vals.fields, lastConfirmedAt: new Date(), updatedAt: new Date(),\n          }]);\n        }),\n      } as never)\n      .mockReturnValueOnce(makeChain([])); // confirmedCount update\n\n    const res = await request(app)\n      .put(\"/api/services/1/extraction-draft/test-uuid-abc/confirm\")\n      .set(\"Cookie\", authCookie)\n      .send({\n        // User reviewed the document and confirmed a new monthly cost\n        confirmedFields: { monthlyCostGbp: { value: 45.99, source: \"extracted_confirmed\" } },\n        deletedFields: [],\n      });\n\n    expect(res.status).toBe(200);\n    expect(savedFields).not.toBeNull();\n    const saved = savedFields as Record<string, { value: unknown; source: string }>;\n    // Confirmed value wins \u2014 user explicitly approved it from the document\n    expect(saved[\"monthlyCostGbp\"]!.value).toBe(45.99);\n    expect(saved[\"monthlyCostGbp\"]!.source).toBe(\"extracted_confirmed\");\n  });\n});\n\n// \u2500\u2500\u2500 Household profile \u2014 partial PATCH semantics \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"PUT /api/household-profile \u2014 partial PATCH semantics\", () => {\n  it(\"returns 401 without auth\", async () => {\n    const res = await request(app).put(\"/api/household-profile\").send({ postcode: \"SW1A1AA\" });\n    expect(res.status).toBe(401);\n  });\n\n  it(\"persists only the supplied field, leaving other columns untouched\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    const existingProfile = {\n      id: 1, postcode: \"EC1A1BB\", propertyType: \"flat\", tenure: \"owner\",\n      bedrooms: 2, yearBuilt: 1995, numAdults: 2, numChildren: 0,\n      heatingType: \"gas\", hasEv: false, evChargerType: null,\n      hasSolar: false, solarExportTariff: null,\n      annualElectricityKwh: 3000, annualGasKwh: 12000,\n      hasSkyTv: false, hasSkyMobile: false, hasVirginMedia: false,\n      numCars: 1, carMake: \"Toyota\", carModel: \"Corolla\", carYear: 2019,\n      carValue: 12000, annualMileage: 8000, drivingExperience: \"10 years\",\n      claimsLast5Years: 0, smoker: false,\n      accessibilityNeeds: null, generalPreferences: null,\n      questionnaireVersion: \"1\",\n      updatedAt: new Date(), createdAt: new Date(),\n    };\n\n    let capturedPatch: Record<string, unknown> = {};\n    vi.mocked(db.select).mockReturnValueOnce(makeChain([existingProfile])); // existing row\n    vi.mocked(db.update).mockReturnValueOnce({\n      set: vi.fn().mockImplementation((vals: Record<string, unknown>) => {\n        capturedPatch = vals;\n        // Drizzle merges: return a record that looks like the profile with the patch applied\n        return makeChain([{ ...existingProfile, ...vals, updatedAt: new Date() }]);\n      }),\n    } as never);\n\n    const res = await request(app)\n      .put(\"/api/household-profile\")\n      .set(\"Cookie\", authCookie)\n      .send({ postcode: \"SW1A1AA\" }); // only send one field\n\n    expect(res.status).toBe(200);\n    // The patch object passed to Drizzle must NOT include other profile columns\n    expect(capturedPatch).toHaveProperty(\"postcode\", \"SW1A1AA\");\n    // Critically, no other column was included in the patch \u2014 not even undefined\n    const patchKeys = Object.keys(capturedPatch);\n    expect(patchKeys.filter((k) => k !== \"postcode\" && k !== \"updatedAt\").length).toBe(0);\n  });\n});\n\n// \u2500\u2500\u2500 Extraction replay prevention \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"extraction replay prevention\", () => {\n  it(\"returns 409 when trying to confirm an already-applied extraction draft\", async () => {\n    const { db } = await import(\"@workspace/db\");\n    const mockService = { id: 1, serviceType: \"Broadband\", provider: \"BT\" };\n    const consumedExtraction = {\n      id: 10,\n      serviceId: 1,\n      extractionId: \"already-used-uuid\",\n      fieldCount: 1,\n      confirmedCount: 1,\n      draftFieldKeys: [\"monthlyCostGbp\"],\n      extractedAt: new Date(),\n      deletedAt: new Date(), // already consumed\n    };\n\n    vi.mocked(db.select)\n      .mockReturnValueOnce(makeChain([mockService]))\n      .mockReturnValueOnce(makeChain([consumedExtraction]));\n\n    const res = await request(app)\n      .put(\"/api/services/1/extraction-draft/already-used-uuid/confirm\")\n      .set(\"Cookie\", authCookie)\n      .send({ confirmedFields: {}, deletedFields: [] });\n\n    expect(res.status).toBe(409);\n    expect(res.body.error).toMatch(/already been applied/i);\n  });\n});\n\n// \u2500\u2500\u2500 completeness.ts unit coverage \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u  () => chain,\n    limit: () => resolved,\n    returning: () => resolved,\n    then: (\n      onfulfilled?: (v: unknown) => unknown,\n      onrejected?: (r: unknown) => unknown,\n    ) => resolved.then(onfulfilled, onrejected),\n    catch: (onrejected?: (r: unknown) => unknown) => resolved.catch(onrejected),\n    finally: (onfinally?: () => void) => resolved.finally(onfinally),\n  };\n  return chain as ReturnType<typeof db.select>;\n}\n\n// \u2500\u2500\u2500 URL sanitisation \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"validUrl\", () => {\n  it(\"accepts http and https URLs\", () => {\n    expect(validUrl(\"https://example.com\")).toBe(true);\n    expect(validUrl(\"http://example.com/path?q=1\")).toBe(true);\n  });\n\n  it(\"rejects non-http schemes\", () => {\n    expect(validUrl(\"javascript:alert(1)\")).toBe(false);\n    expect(validUrl(\"ftp://example.com\")).toBe(false);\n    expect(validUrl(\"data:text/html,<h1>x</h1>\")).toBe(false);\n  });\n\n  it(\"rejects malformed values\", () => {\n    expect(validUrl(\"not-a-url\")).toBe(false);\n    expect(validUrl(\"\")).toBe(false);\n  });\n});\n\ndescribe(\"sanitiseReport\", () => {\n  it(\"filters invalid source URLs and deduplicates\", () => {\n    const report = {\n      service_type: \"Broadband\",\n      as_of_date: \"2026-08-10\",\n      scope_statement: \"test\",\n      current_deal_assessment: \"test\",\n      options: [],\n      recommended_next_step: \"test\",\n      estimated_annual_saving_gbp: null,\n      missing_information: [],\n      comparison_checklist: [],\n      application_pack: [],\n      warnings: [],\n      sources: [\n        \"https://good.com\",\n        \"javascript:evil()\",\n alse);\n    expect(isValidIsoDate(123)).toBe(false);\n    expect(isValidIsoDate(null)).toBe(false);\n  });\n\n  it(\"rejects invalid calendar dates\", () => {\n    expect(isValidIsoDate(\"2026-02-30\")).toBe(false);\n    expect(isValidIsoDate(\"2026-13-01\")).toBe(false);\n  });\n});\n\ndescribe(\"validateServiceInput\", () => {\n  it(\"returns no errors for valid input\", () => {\n    const errors = validateServiceInput({\n      provider: \"BT\",\n      monthlyCostGbp: 30,\n      annualCostGbp: 360,\n      renewalDate: \"2026-12-01\",\n      contractEndDate: \"2027-01-01\",\n      currentTerms: \"Standard broadband\",\n    });\n    expect(errors).toHaveLength(0);\n  });\n\n  it(\"rejects negative monthly cost\", () => {\n    const errors = validateServiceInput({ monthlyCostGbp: -1 });\n    expect(errors.some((e) => e.field === \"monthlyCostGbp\")).toBe(true);\n  });\n\n  it(\"rejects negative annual cost\", () => {\n    const errors = validateServiceInput({ annualCostGbp: -100 });\n    expect(errors.some((e) => e.field === \"annualCostGbp\")).toBe(true);\n  });\n\n  it(\"accepts zero costs\", () => {\n    const errors = validateServiceInput({\n      monthlyCostGbp: 0,\n      annualCostGbp: 0,\n    });\n    expect(errors).toHaveLength(0);\n  });\n\n  it(\"rejects invalid renewal date format\", () => {\n    const errors = validateServiceInput({ renewalDate: \"01/12/2026\" });\n    expect(errors.some((e) => e.field === \"renewalDate\")).toBe(true);\n  });\n\n  it(\"rejects invalid contract end date format\", () => {\n    const errors = validateServiceInput({ contractEndDate: \"not-a-date\" });\n    expect(errors.some((e) => e.field === \"contractEndDate\")).toBe(true);\n  });\n\n  it(\"rejects provider longer than 255 chars\", () => {\n    const errors = validateServiceInput({ provider: \"x\".repeat(256) });\n    expect(errors.some((e) => e.field === \"provider\")).toBe(true);\n  });\n\n  it(\"rejects currentTerms longer than 5000 chars\", () => {\n    const errors = validateServiceInput({ currentTerms: \"x\".repeat(5001) });\n    expect(errors.some((e) => e.field === \"currentTerms\")).toBe(true);\n  });\n\n  it(\"allows null/undefined optional fields\", () => {\n    const errors = validateServiceInput({\n      monthlyCostGbp: null,\n      renewalDate: null,\n      contractEndDate: undefined,\n    });\n    expect(errors).toHaveLength(0);\n  });\n});\n\ndescribe(\"trimServiceInput\", () => {\n  it(\"trims whitespace from provider and location\", () => {\n    const result = trimServiceInput({\n      provider: \"  BT  \",\n      location: \"\\t London \\n\",\n      productName: \" Fibre 2 \",\n    });\n    expect(result[\"provider\"]).toBe(\"BT\");\n    expect(result[\"location\"]).toBe(\"London\");\n    expect(result[\"productName\"]).toBe(\"Fibre 2\");\n  });\n\n  it(\"does not mutate the original object\", () => {\n    const original = { provider: \"  BT  \" };\n    trimServiceInput(original);\n    expect(original.provider).toBe(\"  BT  \");\n  });\n});\n\n// \u2500\u2500\u2500 AI report Zod schema parsing (mocked OpenAI output) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"DealReport Zod validation (import-level test)\", () => {\n  it(\"valid report parses successfully\", async () => {\n    const { DealReportSchema } = await import(\"../src/lib/research-service-schema\");\n    const validReport = {\n      service_type: \"Broadband\",\n      as_of_date: \"2026-08-10\",\n      scope_statement: \"UK broadband comparison\",\n      current_deal_assessment: \"Current deal is above market rate\",\n      options: [\n        {\n          provider: \"BT\",\n          product_name: \"Full Fibre 100\",\n          price_status: \"confirmed_public\",\n          annual_cost_gbp: 420,\n          monthly_cost_gbp: 35,\n          contract_length_months: 24,\n          headline_terms: [\"100Mbps\", \"Free router\"],\n          important_exclusions: [],\n          source_urls: [\"https://bt.com\"],\n        },\n      ],\n      recommended_next_step: \"Compare with Vodafone\",\n      estimated_annual_saving_gbp: 120,\n      missing_information: [],\n      comparison_checklist: [\"Check exit fees\"],\n      application_pack: [\"Current bill\"],\n      warnings: [],\n      sources: [\"https://bt.com\"],\n      comparison_based_on: [\"Postcode: SW1A 1AA\"],\n    };\n    const result = DealReportSchema.safeParse(validReport);\n    expect(result.success).toBe(true);\n  });\n\n  it(\"rejects report missing required fields\", async () => {\n    const { DealReportSchema } = await import(\"../src/lib/research-service-schema\");\n    const result = DealReportSchema.safeParse({ service_type: \"Broadband\" });\n    expect(result.success).toBe(false);\n  });\n\n  it(\"rejects invalid price_status enum\", async () => {\n    const { DealReportSchema } = await import(\"../src/lib/research-service-schema\");\n    const result = DealReportSchema.safeParse({\n      service_type: \"Broadband\",\n      as_of_date: \"2026-08-10\",\n      scope_statement: \"test\",\n      current_deal_assessment: \"test\",\n      options: [\n        {\n          provider: \"BT\",\n          product_name: \"X\",\n          price_status: \"best_deal\", // invalid\n          annual_cost_gbp: null,\n          monthly_cost_gbp: null,\n          contract_length_months: null,\n          headline_terms: [],\n          important_exclusions: [],\n          source_urls: [],\n        },\n      ],\n      recommended_next_step: \"test\",\n      estimated_annual_saving_gbp: null,\n      missing_information: [],\n      comparison_checklist: [],\n      application_pack: [],\n      warnings: [],\n      sources: [],\n    });\n    expect(result.success).toBe(false);\n  });\n});\n\n// \u2500\u2500\u2500 queueResearch idempotency & conflict handling \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndescribe(\"queueResearch\", () => {\n  beforeEach(() => {\n    vi.restoreAllMocks();\n  });\n\n  it(\"returns existing run ID when an active run already exists (idempotent)\", async () => {\n    // Scenario: two concurrent callers \u2014 first wins the insert, second sees\n    // the active run at the application-level check and returns immediately.\n    const activeRun = { id: 42, serviceId: 1, status: \"queued\" as const };\n    const service = { id: 1, active: true };\n\n    // Service lookup\n    vi.mocked(db.select).mockImplementationOnce(() =>\n      makeChain([service]),\n    );\n    // Application-level existing-run check \u2192 returns the active run\n    vi.mocked(db.select).mockImplementationOnce(() =>\n      makeChain([activeRun]),\n    );\n\n    const runId = await queueResearch(1, \"manual\");\n    expect(runId).toBe(42);\n    // Insert must NOT have been called\n    expect(vi.mocked(db.insert)).not.toHaveBeenCalled();\n  });\n\n  it(\"creates a new run when no active run exists\", async () => {\n    const service = { id: 1, active: true };\n    const newRun = { id: 99, serviceId: 1, status: \"queued\" as const };\n\n    // Service lookup\n    vi.mocked(db.select).mockImplementationOnce(() => makeChain([service]));\n    // Application-level check \u2192 no active run\n    vi.mocked(db.select).mockImplementationOnce(() => makeChain([]));\n    // Insert succeeds\n    vi.mocked(db.insert).mockImplementationOnce(() => makeChain([newRun]));\n\n    const runId = await queueResearch(1, \"manual\");\n    expect(runId).toBe(99);\n  });\n\n  it(\"handles DB-level conflict (ON CONFLICT DO NOTHING) by fetching the winner\", async () => {\n    // Scenario: application-level check misses the race (returns empty), but\n    // the DB index fires, making insert return empty.  The function then\n    // fetches the run inserted by the other caller.\n    const service = { id: 1, active: true };\n    const winnerRun = { id: 77, service
